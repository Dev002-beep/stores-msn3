  // =========================================================================

  const DEFAULT_PRODUCT_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22400%22%20viewBox%3D%220%200%20300%20400%22%3E%3Crect%20fill%3D%22%23090d16%22%20width%3D%22300%22%20height%3D%22400%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22260%22%20height%3D%22360%22%20rx%3D%2220%22%20fill%3D%22%230f172a%22%20stroke%3D%22%231e293b%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22160%22%20r%3D%2242%22%20fill%3D%22%231e293b%22%20stroke%3D%22%2306b6d4%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%224%204%22%2F%3E%3Cpath%20d%3D%22M136%20160%20l10%2010%2018-18%22%20stroke%3D%22%2306b6d4%22%20stroke-width%3D%223%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Ctext%20x%3D%22150%22%20y%3D%22235%22%20fill%3D%22%2338bdf8%22%20font-family%3D%22sans-serif%22%20font-size%3D%2214%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%3E%D8%B5%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D9%85%D9%86%D8%AA%D8%AC%3C%2Ftext%3E%3Ctext%20x%3D%22150%22%20y%3D%22258%22%20fill%3D%22%2364748b%22%20font-family%3D%22sans-serif%22%20font-size%3D%2211%22%20text-anchor%3D%22middle%22%3E%D9%85%D8%AA%D8%AC%D8%B1%20%D8%AE%D8%A7%D8%B5%3C%2Ftext%3E%3C%2Fsvg%3E";

  const DEFAULT_STORE_LOGO = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20fill%3D%22%230f172a%22%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%2F%3E%3Cpath%20d%3D%22M28%2065%20V40%20L50%2024%20L72%2040%20V65%20Z%22%20stroke%3D%22%2306b6d4%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2248%22%20r%3D%227%22%20fill%3D%22%2338bdf8%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2282%22%20fill%3D%22%2338bdf8%22%20font-family%3D%22sans-serif%22%20font-size%3D%2210%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%3ESTORE%3C%2Ftext%3E%3C%2Fsvg%3E";

  window.DEFAULT_PRODUCT_IMG = DEFAULT_PRODUCT_IMG;
  window.DEFAULT_STORE_LOGO = DEFAULT_STORE_LOGO;

  async function compressImage(file, maxWidth = 800, maxHeight = 1066, quality = 0.8) {
    if (!file || !file.type || !file.type.startsWith('image/')) return file;
    if (file.type === 'image/svg+xml' || file.type === 'image/gif') return file;

    return new Promise((resolve) => {
      const img = new Image();
      const tempUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(tempUrl);
        let { width, height } = img;
        if (width > maxWidth || height > maxHeight) {
          const ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          if (!blob) {
            resolve(file);
          } else {
            const compressed = new File([blob], (file.name || 'image').replace(/\.[^/.]+$/, "") + ".jpg", {
              type: 'image/jpeg',
              lastModified: Date.now()
            });
            resolve(compressed);
          }
        }, 'image/jpeg', quality);
      };
      img.onerror = () => {
        URL.revokeObjectURL(tempUrl);
        resolve(file);
      };
      img.src = tempUrl;
    });
  }

  // Converts any file to an optimized permanent Base64 Data URL (~50KB) that works 100% offline & across reloads
  async function fileToDataUrl(file, maxWidth = 800, maxHeight = 1066) {
    try {
      const compressed = await compressImage(file, maxWidth, maxHeight, 0.8);
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(DEFAULT_PRODUCT_IMG);
        reader.readAsDataURL(compressed);
      });
    } catch (e) {
      return DEFAULT_PRODUCT_IMG;
    }
  }

  // Egyptian Mobile Validator (Starts with 010, 011, 012, 015 - exactly 11 digits)
  function isValidEgyptianPhone(phone) {
    if (!phone) return false;
    const clean = phone.trim().replace(/[\s-]/g, '');
    return /^(010|011|012|015)[0-9]{8}$/.test(clean);
  }

  async function uploadImageToCatbox(file, onProgress = () => {}) {
    if (!file) throw new Error('يرجى اختيار صورة صالحة');
    if (!file.type || !file.type.startsWith('image/')) throw new Error('الملف المختار ليس صورة');

    onProgress('جاري تحسين وضغط الصورة...');
    const optimizedFile = await compressImage(file);

    onProgress('جاري رفع الصورة إلى السيرفر السحابي...');

    // 1. Catbox upload via CORS proxy
    try {
      const fd = new FormData();
      fd.append('reqtype', 'fileupload');
      fd.append('fileToUpload', optimizedFile);

      const target = 'https://catbox.moe/user/api.php';
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(target);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      const res = await fetch(proxyUrl, {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.ok) {
        const text = (await res.text()).trim();
        if (text.startsWith('http://') || text.startsWith('https://')) {
          const secureUrl = text.replace(/^http:\/\//, 'https://');
          onProgress('تم رفع الصورة بنجاح!');
          return secureUrl;
        }
      }
    } catch (err) {
      console.warn('Proxy upload attempt 1 failed:', err.message);
    }

    // 2. Direct Catbox upload (if supported by environment)
    try {
      const fd = new FormData();
      fd.append('reqtype', 'fileupload');
      fd.append('fileToUpload', optimizedFile);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      const directRes = await fetch('https://catbox.moe/user/api.php', {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (directRes.ok) {
        const text = (await directRes.text()).trim();
        if (text.startsWith('http://') || text.startsWith('https://')) {
          const secureUrl = text.replace(/^http:\/\//, 'https://');
          onProgress('تم رفع الصورة بنجاح!');
          return secureUrl;
        }
      }
    } catch (err) {
      console.warn('Direct upload failed:', err.message);

    // 3. Fallback: Secondary Cloud Host (FreeImage.host API)
    try {
      onProgress('جاري الحفظ عبر السيرفر الاحتياطي...');
      const fd = new FormData();
      fd.append('key', '6d207e02198a847aa98d0a2a901485a5');
      fd.append('action', 'upload');
      fd.append('source', optimizedFile);
      fd.append('format', 'json');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      const secRes = await fetch('https://freeimage.host/api/1/upload', {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (secRes.ok) {
        const json = await secRes.json();
        if (json && json.image && json.image.url) {
          onProgress('تم رفع الصورة بنجاح!');
          return json.image.url;
        }
      }
    } catch (err) {
      console.warn('Secondary cloud failed:', err.message);
    }

    // 4. Safe compressed Data URL fallback (never fails, instant, fits within limits)
    onProgress('تم حفظ الصورة بنجاح!');
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(optimizedFile);
    });
  }

  // Validate Code
  async function validateActivationCode(codeStr) {
    if (!codeStr || !codeStr.trim()) {
      return { valid: false, error: 'يرجى إدخال كود التفعيل' };
    }
    const clean = codeStr.trim().toUpperCase();

    // Check Firestore
    if (fbDb) {
      try {
        const snapshot = await withTimeout(
          fbDb.collection('activation_codes').where('code', '==', clean).get(),
          2500
        );
        if (!snapshot.empty) {
          const docSnap = snapshot.docs[0];
          const data = docSnap.data();
          if (data.isUsed) {
            return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${data.usedByStoreName || 'آخر'}"` };
          }
          return { valid: true, durationDays: data.durationDays || 30, codeData: data };
        }
      } catch (e) {
        console.warn('Firestore code check note:', e.message);
      }
    }

    // Check Local
    const localCodes = getLocalData('codes', []);
    const found = localCodes.find(c => c.code.toUpperCase() === clean);
    if (found) {
      if (found.isUsed) {
        return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${found.usedByStoreName || 'آخر'}"` };
      }
      return { valid: true, durationDays: found.durationDays || 30, codeData: found };
    }

    return { valid: false, error: 'كود التفعيل غير صحيح أو غير موجود بالنظام' };
  }

      telegram: telegram ? telegram.trim().replace(/^@/, '') : '',
      currency: currency.trim() || 'ج.م',
      bio: bio.trim(),
      categories: ['عام'],
      activationCode: activationCode.toUpperCase(),
      durationDays: durationDays,
      createdAt: now,
      activatedAt: now,
      expiresAt: expiresAt,
      status: 'active'
    };

    if (fbDb) {

        await withTimeout(fbDb.collection('stores').doc(storeId).set(storeData), 2500);

  // Format WhatsApp Link (Handles Egyptian phone numbers starting with 010, 011, 012, 015)
  function formatEgyptianWaLink(rawPhone, messageText = '') {
    if (!rawPhone) return '';
    let digits = rawPhone.replace(/[^0-9]/g, '');
    if (digits.length === 11 && digits.startsWith('01')) {
      digits = '2' + digits; // Format as 2010...
    }
    const textQuery = messageText ? `?text=${encodeURIComponent(messageText)}` : '';
    return `https://wa.me/${digits}${textQuery}`;
  }

  // Format Telegram Link (Username, link, or channel)
  function formatTelegramLink(rawTg, messageText = '') {
    if (!rawTg) return '';
    let clean = rawTg.trim();
    if (clean.startsWith('http://') || clean.startsWith('https://')) {
      return clean;
    }
    if (clean.startsWith('t.me/')) {
      return `https://${clean}`;
    }
    if (clean.startsWith('@')) {
      clean = clean.slice(1);
    }
    return `https://t.me/${clean}`;
  }

  // Subscription Time Remaining
  function getSubscriptionTimeRemaining(expiresAt) {
    const diff = (expiresAt || 0) - Date.now();
    if (diff <= 0) {
      return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0, formatted: 'منتهي الصلاحية' };
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    let formatted = '';
    if (days > 0) formatted += `${days} يوم و `;
    formatted += `${hours} ساعة و ${minutes} دقيقة`;

    return { expired: false, days, hours, minutes, seconds, formatted };
  }

  // Renew Store Subscription
  async function renewStoreSubscription(storeId, newCodeStr) {
    const validation = await validateActivationCode(newCodeStr);
    if (!validation.valid) throw new Error(validation.error);

    const store = await getStoreById(storeId);
    if (!store) throw new Error('المتجر غير موجود');

    const now = Date.now();
    const additionalMs = validation.durationDays * 24 * 60 * 60 * 1000;
    const baseTime = (store.expiresAt && store.expiresAt > now) ? store.expiresAt : now;
    const newExpiresAt = baseTime + additionalMs;

    const updates = {
      expiresAt: newExpiresAt,
      durationDays: (store.durationDays || 0) + validation.durationDays,
      status: 'active',
      lastRenewedAt: now,
      lastRenewCode: newCodeStr.trim().toUpperCase()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('stores').doc(storeId).update(updates), 2500);
      } catch (e) {}
    }

    const localStores = getLocalData('stores', []);
    const target = localStores.find(s => s.id === storeId);
    if (target) {
      Object.assign(target, updates);
      setLocalData('stores', localStores);
    }

    await markCodeAsUsed(newCodeStr, storeId, store.name);
    return { success: true, newExpiresAt, addedDays: validation.durationDays };
  }

  // Orders & Deals CRUD (Supports Multi-item Shopping Cart + Single Item fallback)
  async function createOrder({ storeId, items = [], productId, productTitle, productPrice, orderQuantity = 1, customerId, customerWhatsapp, notes = '' }) {
    const orderId = `ORD-${Date.now().toString().slice(-6)}-${Math.floor(Math.random() * 900 + 100)}`;
    
    // Normalize items array
    let orderItems = Array.isArray(items) && items.length > 0 ? items.map(it => ({
      productId: it.productId || it.id,
      title: it.title || it.productTitle || '',
      price: parseFloat(it.price || it.productPrice) || 0,
      quantity: parseInt(it.quantity || it.orderQuantity, 10) || 1,
      category: it.category || 'عام',
      imageUrl: it.imageUrl || ''
    })) : [];

    // Fallback if single product was passed
    if (orderItems.length === 0 && (productId || productTitle)) {
      orderItems.push({
        productId: productId || '',
        title: productTitle || '',
        price: parseFloat(productPrice) || 0,
        quantity: parseInt(orderQuantity, 10) || 1,
        category: 'عام',
        imageUrl: ''
      });
    }

    const calculatedTotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const totalQty = orderItems.reduce((sum, item) => sum + item.quantity, 0);
    const summaryTitle = orderItems.map(item => `${item.title} (x${item.quantity})`).join(' + ');

    const orderData = {
      id: orderId,
      storeId,
      items: orderItems,
      // Backward-compatible fields
      productId: orderItems[0] ? orderItems[0].productId : (productId || ''),
      productTitle: summaryTitle || productTitle || '',
      productPrice: orderItems[0] ? orderItems[0].price : (parseFloat(productPrice) || 0),
      orderQuantity: totalQty,
      totalPrice: calculatedTotal,
      customerId: (customerId || '').trim(),
      customerWhatsapp: (customerWhatsapp || '').trim().replace(/[^0-9+]/g, ''),
      notes: (notes || '').trim(),
      status: 'pending',
      createdAt: Date.now(),
      completedAt: null
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('orders').doc(orderId).set(orderData), 2500);
      } catch (e) {}
    }

    const localOrders = getLocalData('orders', []);
    localOrders.unshift(orderData);
    setLocalData('orders', localOrders);
    return orderData;

  // Complete Deal: Only decrease quantity when marked completed! (Supports multiple items in an order)
  async function completeDeal(orderId, storeId) {
    let order = null;
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('orders').doc(orderId).get(), 2000);
        if (snap.exists) order = snap.data();
      } catch (e) {}
    }
    if (!order) {
      const localOrders = getLocalData('orders', []);
      order = localOrders.find(o => o.id === orderId);
    }
    if (!order) throw new Error('الطلب غير موجود');
    if (order.status === 'completed') throw new Error('الصفقة مكتملة بالفعل مسبقاً');

    // Determine list of items to deduct
    const itemsToDeduct = (Array.isArray(order.items) && order.items.length > 0)
      ? order.items
      : [{ productId: order.productId, quantity: order.orderQuantity || 1 }];

    const localProducts = getLocalData('products', []);
    let totalDeducted = 0;

    for (const item of itemsToDeduct) {
      const pId = item.productId;
      const qty = parseInt(item.quantity, 10) || 1;
      if (!pId) continue;

      let product = null;
      if (fbDb) {
        try {
          const pSnap = await withTimeout(fbDb.collection('products').doc(pId).get(), 2000);
          if (pSnap.exists) product = pSnap.data();
        } catch (e) {}
      }
      if (!product) {
        product = localProducts.find(p => p.id === pId);
      }

      if (product) {
        const newQty = Math.max(0, (parseInt(product.quantity, 10) || 0) - qty);
        if (fbDb) {
          try {
            await withTimeout(fbDb.collection('products').doc(pId).update({ quantity: newQty }), 2000);
          } catch (e) {}
        }
        const pTarget = localProducts.find(p => p.id === pId);
        if (pTarget) {
          pTarget.quantity = newQty;
        }
        totalDeducted += qty;
      }
    }
    setLocalData('products', localProducts);

    const orderUpdates = { status: 'completed', completedAt: Date.now() };
    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('orders').doc(orderId).update(orderUpdates), 2000);
      } catch (e) {}
    }
    const localOrders = getLocalData('orders', []);
    const oTarget = localOrders.find(o => o.id === orderId);
    if (oTarget) {
      Object.assign(oTarget, orderUpdates);
      setLocalData('orders', localOrders);
    }

    return { success: true, orderId, deducted: totalDeducted };
  }

  async function getPresetImages() {
    let list = [];
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('preset_images').get(), 2500);
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      } catch (e) {}
    }

    let localPresets = getLocalData(PRESET_IMAGES_STORAGE_KEY, null);
    if (!localPresets || !localPresets.length) {
      localPresets = [...DEFAULT_PRESET_IMAGES];
      setLocalData(PRESET_IMAGES_STORAGE_KEY, localPresets);
    }

    const map = new Map();
    localPresets.forEach(img => map.set(img.id, img));
    list.forEach(img => map.set(img.id, img));
    return Array.from(map.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  async function addPresetImage({ title, imageUrl, category = 'عام' }) {
    if (!imageUrl) throw new Error('يرجى تحديد أو رفع صورة');
    const id = `preset_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`;
    const imgData = {
      id,
      title: (title || 'صورة مقترحة').trim(),
      category: (category || 'عام').trim(),
      imageUrl: imageUrl.trim(),
      createdAt: Date.now()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('preset_images').doc(id).set(imgData), 2500);
      } catch (e) {}
    }

    const localPresets = getLocalData(PRESET_IMAGES_STORAGE_KEY, [...DEFAULT_PRESET_IMAGES]);
    localPresets.unshift(imgData);
    setLocalData(PRESET_IMAGES_STORAGE_KEY, localPresets);
    return imgData;
  }

  async function deletePresetImage(id) {
    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('preset_images').doc(id).delete(), 2000);
      } catch (e) {}
    }
    const localPresets = getLocalData(PRESET_IMAGES_STORAGE_KEY, [...DEFAULT_PRESET_IMAGES]).filter(p => p.id !== id);
    setLocalData(PRESET_IMAGES_STORAGE_KEY, localPresets);
    return true;
  }

  function getAdminPasskey() {
    return localStorage.getItem(ADMIN_PASSKEY_STORAGE) || DEFAULT_ADMIN_PASSKEY;
  }
  function setAdminPasskey(newKey) {
    if (newKey && newKey.trim().length >= 6) {
      localStorage.setItem(ADMIN_PASSKEY_STORAGE, newKey.trim());
      return true;
    }
    return false;
  }
  function verifyAdmin(passkey) {
    if (passkey && passkey.trim() === getAdminPasskey()) {
      sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
      return true;
    }
    return false;
  }
  function isAdminLoggedIn() {
    return sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true';
  }
  function logoutAdmin() {
    sessionStorage.removeItem(ADMIN_SESSION_KEY);
  }

  async function registerMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.createUserWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          try {
            const lCred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
            uid = lCred.user.uid;
          } catch (err) {
            throw new Error('هذا البريد مسجل مسبقاً، يرجى تسجيل الدخول أو اختيار بريد آخر.');
          }
        }
      }
    }
    if (!uid) {
      uid = `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
    }

    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  async function loginMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {}
    }
    if (!uid) {
      const store = await getStoreByOwner(null, cleanEmail);
      if (store) {
        uid = store.ownerUid || `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
      } else {
        throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة، أو المتجر غير مسجل.');
      }
    }
    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  function getCurrentMerchant() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  async function logoutMerchant() {
    if (fbAuth) {
      try { await fbAuth.signOut(); } catch (e) {}
    }
    localStorage.removeItem(SESSION_KEY);
  }

  let activeStore = null;
  let countdownInterval = null;

  function parseCurrentRoute() {
    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    if (storeParam) {
      return { view: 'store', slug: storeParam.trim().toLowerCase() };
    }

    const hash = window.location.hash.replace(/^#\/?/, '').trim();

    if (hash.startsWith('store/')) {
      const slug = hash.replace('store/', '').trim().toLowerCase();
      return { view: 'store', slug };
    }
    if (hash === 'admin') return { view: 'admin' };
    if (hash === 'merchant' || hash === 'login') return { view: 'merchant' };
    if (hash === 'register' || hash === 'create') return { view: 'register' };

    // Subdomain check
    const host = window.location.hostname.toLowerCase();
    if (host.endsWith('stores.privateee.online') && host !== 'stores.privateee.online') {
      const sub = host.split('.')[0];
      if (sub && sub !== 'www') return { view: 'store', slug: sub };
    }

    if (hash && !['home', 'contact', 'about'].includes(hash)) {
      return { view: 'store', slug: hash.toLowerCase() };
    }

    return { view: 'landing' };
  }

  function updateNavHighlight(activeKey) {
    const links = document.querySelectorAll('.nav-link-btn');
    links.forEach(l => {
      if (l.dataset.nav === activeKey) {
        l.classList.add('text-cyan-400', 'bg-cyan-500/10');
        l.classList.remove('text-gray-300');
      } else {
        l.classList.remove('text-cyan-400', 'bg-cyan-500/10');
        l.classList.add('text-gray-300');
      }
    });
  }

  async function navigate(targetHash = null) {
    if (targetHash !== null) {
      if (window.location.hash !== targetHash) {
        window.location.hash = targetHash;
        return;
      }
    }

    const route = parseCurrentRoute();
    const mainContainer = document.getElementById('main-content');
    const navbar = document.getElementById('main-navbar');

    if (!mainContainer) return;
    mainContainer.innerHTML = '';

    switch (route.view) {
      case 'store':
        if (navbar) navbar.classList.add('hidden');
        mainContainer.innerHTML = `<div id="storefront-container"></div>`;
        initStorefront(route.slug, document.getElementById('storefront-container'));
        break;

      case 'admin':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('admin');
        mainContainer.innerHTML = `<div id="admin-container"></div>`;
        renderAdminView();
        break;

      case 'merchant':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('merchant');
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('dashboard');
        break;

      case 'register':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('register');
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('register');
        break;

      case 'landing':
      default:
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('home');
        renderLandingPage(mainContainer);
        break;
    }

    window.scrollTo(0, 0);
    if (window.lucide) window.lucide.createIcons();
  }

  function initMerchantModule(action = 'dashboard') {
    const container = document.getElementById('merchant-container');
    if (!container) return;

    if (action === 'register') {
      renderMerchantRegistration(container);
      return;
    }

    const currentMerchant = getCurrentMerchant();
    if (!currentMerchant) {
      renderMerchantLogin(container);
      return;
    }

    getStoreByOwner(currentMerchant.uid, currentMerchant.email).then(store => {
      activeStore = store;
      if (!activeStore) {
        renderMerchantRegistration(container, currentMerchant);
        return;
      }

      const timeRemaining = getSubscriptionTimeRemaining(activeStore.expiresAt);
      if (timeRemaining.expired || activeStore.status === 'expired') {
        renderExpiredSubscriptionScreen(container, activeStore);
        return;
      }

      renderMerchantDashboard(container, activeStore);
    });
  }

          .toLowerCase()

      const val = slugInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
      previewLink.textContent = getStoreDirectUrl(val || '...');
    };

    btnVerify.onclick = async () => {
      const codeVal = codeInput.value.trim();

        codeError.classList.remove('hidden');
        return;
      }

      btnVerify.disabled = true;
      btnVerify.innerHTML = `<span>جاري الفحص...</span>`;
      codeError.classList.add('hidden');

      const result = await validateActivationCode(codeVal);

      if (result.valid) {
        validatedCode = codeVal;

        btnVerify.classList.add('hidden');

      } else {
        codeError.textContent = result.error || 'الكود غير صالح';

      }

      btnVerify.disabled = false;
      btnVerify.innerHTML = `<span>تأكيد الكود</span><i data-lucide="check" class="w-5 h-5"></i>`;

    const previewBox = document.getElementById('logo-preview-box');
    const uploadStatus = document.getElementById('logo-upload-status');

    btnUploadLogo.onclick = () => fileInput.click();

      const file = fileInput.files[0];
      if (!file) return;

      btnUploadLogo.disabled = true;
      uploadStatus.innerHTML = `<span class="text-cyan-400 font-semibold animate-pulse">جاري تجهيز الشعار...</span>`;

      // 1. Immediately create permanent optimized Base64 Data URL
      const persistentLogoUrl = await fileToDataUrl(file, 400, 400);
      uploadedLogoUrl = persistentLogoUrl;
      previewBox.innerHTML = `<img src="${persistentLogoUrl}" class="w-full h-full object-cover rounded-2xl" />`;
      uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم تجهيز الشعار بنجاح!</span>`;

      // 2. Asynchronously upload to cloud (Catbox) in background
      uploadImageToCatbox(file, (msg) => { 
        uploadStatus.innerHTML = `<span class="text-cyan-400 text-xs">${msg}</span>`; 
      }).then((cloudUrl) => {
        if (cloudUrl && (cloudUrl.startsWith('http://') || cloudUrl.startsWith('https://'))) {
          uploadedLogoUrl = cloudUrl;
          uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم الرفع السحابي للشعار!</span>`;
        }
      }).catch(() => {
        // Fallback persistentLogoUrl is already set and ready
      }).finally(() => {
        btnUploadLogo.disabled = false;
      });
    };

    detailsForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!validatedCode) {
        Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى تأكيد كود التفعيل أولاً' });

          title: 'تنبيه',

        return;

          text: 'رقم الواتساب يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون مكوناً من 11 رقماً.'
        });

      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>جاري تفعيل متجرك...</span>`;

      try {
        let ownerUid = existingSession?.uid;
        let ownerEmail = existingSession?.email;

        if (!existingSession) {
          const email = document.getElementById('reg-merchant-email').value;
          const pass = document.getElementById('reg-merchant-pass').value;
          const regRes = await registerMerchant(email, pass);
          ownerUid = regRes.uid;
          ownerEmail = regRes.email;
        }

        const codeCheck = await validateActivationCode(validatedCode);
        const durationDays = codeCheck.durationDays || 30;

        const newStore = await createStore({
          ownerUid,
          ownerEmail,
          storeName,
          slug,
          logoUrl: uploadedLogoUrl || DEFAULT_STORE_LOGO,
          whatsapp,
          telegram,
          currency,
          activationCode: validatedCode,
          durationDays
        });

        if (window.confetti) window.confetti({ particleCount: 100, spread: 90 });

        const directUrl = getStoreDirectUrl(newStore.slug);
        await Swal.fire({
          icon: 'success',
          title: '🎉 ألف مبروك! تم تفعيل متجرك بنجاح',
          html: `
            <div class="text-right space-y-3 mt-3 text-sm">
              <p>متجرك مفعل ويعمل الآن لمدة <strong class="text-emerald-400 font-bold">${durationDays} يوماً</strong>.</p>
              <div class="p-3 bg-slate-900 rounded-xl border border-cyan-500/30 text-left font-code text-cyan-400 font-bold break-all select-all">
                ${directUrl}
              </div>
              <p class="text-xs text-gray-400">يمكنك نسخ هذا الرابط المباشر وإرساله لعملائك للبدء بالشراء.</p>
            </div>
          `,
          confirmButtonText: 'الدخول إلى لوحة تحكم المتجر'
        });

        activeStore = newStore;
        renderMerchantDashboard(container, newStore);

      } catch (err) {

    // Render Category Pills
    function renderCategoryPills() {
      const pillsContainer = document.getElementById('merchant-category-pills');

        const isDefault = cat === 'عام';
        return `
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-gray-200">

          if (confirm.isConfirmed) {
            await deleteProduct(prodId);
            const idx = products.findIndex(p => p.id === prodId);
            if (idx >= 0) products.splice(idx, 1);
            renderGrid();
          }
        };
      });
    }

    renderGrid();

    document.getElementById('btn-open-add-product').onclick = () => {
      openProductModal(store, null, () => renderProductsTab(contentDiv, store));
    };
  }

        });
      };

    // Rating Box UI Highlighting
    const ratingBoxes = modalEl.querySelectorAll('.rating-box');
    function updateRatingUi(val) {
      selectedRating = val;
      ratingBoxes.forEach(box => {
        if (box.dataset.val === val) {
          if (val === 'flame') {
            box.className = 'rating-box flex flex-col items-center justify-center p-2 rounded-xl border border-orange-500 bg-orange-500/20 text-center shadow-lg shadow-orange-500/20';
          } else {
            box.className = 'rating-box flex flex-col items-center justify-center p-2 rounded-xl border border-amber-500 bg-amber-500/20 text-center shadow-lg shadow-amber-500/20';
          }
        } else {
          box.className = 'rating-box flex flex-col items-center justify-center p-2 rounded-xl border border-slate-700 bg-slate-900 cursor-pointer hover:border-slate-500 transition text-center';
        }
      });
    }
    updateRatingUi(selectedRating);

    ratingBoxes.forEach(box => {
      box.onclick = () => updateRatingUi(box.dataset.val);
    });

    closeBtn.onclick = () => modalEl.remove();

    btnUpload.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      btnUpload.disabled = true;
      uploadStatus.innerHTML = `<span class="text-cyan-400 font-semibold animate-pulse">جاري تحسين وتجهيز الصورة...</span>`;

      // 1. Immediately create permanent optimized Base64 Data URL (persists forever, never 404s)
      const persistentDataUrl = await fileToDataUrl(file);
      uploadedUrl = persistentDataUrl;
      previewBox.innerHTML = `<img src="${persistentDataUrl}" class="w-full h-full object-cover aspect-square" />`;
      uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم تجهيز الصورة بنجاح!</span>`;

      // 2. Asynchronously upload to cloud (Catbox) in background
      uploadImageToCatbox(file, (msg) => { 
        uploadStatus.innerHTML = `<span class="text-cyan-400 text-xs">${msg}</span>`; 
      }).then((cloudUrl) => {
        if (cloudUrl && (cloudUrl.startsWith('http://') || cloudUrl.startsWith('https://'))) {
          uploadedUrl = cloudUrl;
          uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم الرفع السحابي بنجاح!</span>`;
        }
      }).catch(() => {
        // Fallback persistentDataUrl is already set and ready
      }).finally(() => {
        btnUpload.disabled = false;
      });
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('modal-prod-title').value;
      const price = document.getElementById('modal-prod-price').value;
      const quantity = document.getElementById('modal-prod-qty').value;
      const category = document.getElementById('modal-prod-category').value;
      const description = document.getElementById('modal-prod-desc').value;

      const saveBtn = document.getElementById('btn-save-prod');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>جاري الحفظ...</span>`;

      try {
        if (existingProd) {
          await updateProduct(existingProd.id, {
            title,
            price: parseFloat(price),
            quantity: parseInt(quantity, 10),
            category,
            rating: selectedRating,
            description,
            imageUrl: uploadedUrl || existingProd.imageUrl
          });
        } else {
          await addProduct(store.id, {
            title,
            price,
            quantity,
            category,
            rating: selectedRating,
            description,
            imageUrl: uploadedUrl || DEFAULT_PRODUCT_IMG
          });
        }

        modalEl.remove();
        onSuccess();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تم حفظ المنتج بنجاح!', timer: 1500, showConfirmButton: false });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span>حفظ المنتج</span>`;
      }
    };
  }

                  <span class="text-gray-500 font-normal">عدد العناصر: ${(Array.isArray(order.items) && order.items.length) ? order.items.length : 1}</span>
                </div>
                ${(Array.isArray(order.items) && order.items.length > 0) ? order.items.map(it => `
                  <div class="flex items-center justify-between py-1 text-gray-300 border-b border-slate-800/40 last:border-0">
                    <div class="flex items-center gap-2">
                      <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span>
                      <span class="font-bold text-white">${it.title}</span>
                    </div>
                    <div class="font-code text-cyan-300 font-bold">
                      ${it.quantity} × ${it.price} = <span class="text-emerald-400">${(it.quantity * it.price)} ${store.currency || 'ج.م'}</span>
                    </div>
                  </div>
                `).join('') : `
                  <div class="flex items-center justify-between py-1 text-gray-300">
                    <span class="font-bold text-white">${order.productTitle}</span>
                    <span class="font-code text-cyan-300">${order.orderQuantity} × ${order.productPrice} = ${order.totalPrice} ${store.currency || 'ج.م'}</span>
                  </div>
                `}
                <div class="flex items-center justify-between pt-2 border-t border-slate-800 font-bold">
                  <span class="text-gray-200">الإجمالي الكلي:</span>
                  <span class="text-emerald-400 font-code text-sm font-black">${order.totalPrice} ${store.currency || 'ج.م'}</span>
                </div>
              </div>

              ${order.notes ? `
                <div class="text-xs bg-slate-950/60 p-2.5 rounded-lg border border-slate-800 text-gray-300">
                  <strong class="text-amber-400">ملاحظات العميل:</strong> ${order.notes}
                </div>
              ` : ''}
            </div>

            <div>
              ${isPending ? `
                <button data-order-id="${order.id}" class="btn-complete-deal px-5 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-lg transition flex items-center gap-2">
                  <i data-lucide="check-check" class="w-5 h-5 text-amber-300"></i>
                  <span>إتمام الصفقة (خصم الكمية)</span>
                </button>
              ` : `
                <span class="text-xs text-emerald-400 font-bold">صفقة مكتملة</span>
              `}
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      listContainer.querySelectorAll('.btn-complete-deal').forEach(btn => {
        btn.onclick = async () => {
          const orderId = btn.dataset.orderId;
          const confirm = await Swal.fire({
            title: 'إتمام الصفقة؟',
            text: 'سيتم تحويل حالة الطلب لمكتمل وخصم الكمية تلقائياً من المخزون.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'نعم، إتمام وخصم'
          });

          if (confirm.isConfirmed) {
            btn.disabled = true;
            btn.innerHTML = `<span>جاري الإتمام...</span>`;
            try {
              const res = await completeDeal(orderId, store.id);
              if (window.confetti) window.confetti({ particleCount: 70, spread: 70 });
              const ord = orders.find(o => o.id === orderId);
              if (ord) ord.status = 'completed';
              Swal.fire({ icon: 'success', title: 'تمت الصفقة بنجاح!', text: `تم خصم ${res.deducted} قطعة، المتبقي: ${res.newQuantity}` });
              renderOrders();
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
            }
          }
        };
      });
    }

    renderOrders();
  }

        if (!code) {

          return false;
        }

    if (!isStoreActive(store)) {
      container.innerHTML = `
        <div class="max-w-lg mx-auto my-16 p-8 glass-panel rounded-3xl text-center space-y-4 border border-amber-500/30">

          <p class="text-gray-300 text-sm">عذراً، هذا المتجر متوقف مؤقتاً لانتهاء فترة الاشتراك أو الصيانة من قبل التاجر.</p>
        </div>
      `;
      return;
    }

    const products = await getStoreProducts(store.id);
    let selectedCategory = 'all';

    if (!store.categories || !store.categories.length) {
      store.categories = ['عام'];
    }

    // Shopping Cart State
    let cart = [];

    function getCartTotalCount() {
      return cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function getCartTotalPrice() {
      return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    function updateCartBar() {
      const cartBar = document.getElementById('storefront-cart-bar');
      const badgeCount = document.getElementById('cart-badge-count');
      const itemsCount = document.getElementById('cart-bar-items-count');
      const totalPrice = document.getElementById('cart-bar-total-price');

      const totalCount = getCartTotalCount();
      const totalAmount = getCartTotalPrice();

      if (!cartBar) return;

      if (totalCount > 0) {
        cartBar.classList.remove('hidden');
        if (badgeCount) badgeCount.textContent = totalCount;
        if (itemsCount) itemsCount.textContent = `${totalCount} منتجات`;
        if (totalPrice) totalPrice.textContent = `${totalAmount} ${store.currency || 'ج.م'}`;
      } else {
        cartBar.classList.add('hidden');
      }
    }

    function addToCart(product, quantityToAdd = 1) {
      const stock = parseInt(product.quantity, 10) || 0;
      if (stock <= 0) {
        Swal.fire({ icon: 'warning', title: 'نفذت الكمية', text: 'هذا المنتج غير متوفر في المخزون حالياً.' });
        return false;
      }

      const existingIndex = cart.findIndex(item => item.productId === product.id);
      const currentInCart = existingIndex >= 0 ? cart[existingIndex].quantity : 0;
      const newTotal = currentInCart + quantityToAdd;

      if (newTotal > stock) {
        Swal.fire({
          icon: 'warning',
          title: 'الكمية غير متاحة',
          text: `الكمية المتاحة في المخزون هي ${stock} فقط (لديك بالفعل ${currentInCart} في السلة).`
        });
        return false;
      }

      if (existingIndex >= 0) {
        cart[existingIndex].quantity = newTotal;
      } else {
        cart.push({
          productId: product.id,
          title: product.title,
          price: parseFloat(product.price) || 0,
          quantity: quantityToAdd,
          maxStock: stock,
          imageUrl: product.imageUrl || window.DEFAULT_PRODUCT_IMG,
          category: product.category || 'عام'
        });
      }

      updateCartBar();

      // Show brief notification
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1600,
        timerProgressBar: true
      });
      Toast.fire({

      });

      return true;

        <!-- Category Filter Bar -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="storefront-category-pills">

                  ${renderRatingHtml(prod.rating)}
                </div>
                <p class="text-xs text-gray-300 line-clamp-3 leading-relaxed">${prod.description || 'شحن وتسليم فوري ومباشر.'}</p>
              </div>
            </div>

            <div class="p-5 pt-0">
              ${isOutOfStock ? `
                <button disabled class="w-full py-3.5 bg-slate-800 text-gray-500 font-bold rounded-xl text-sm cursor-not-allowed">نفذت الكمية</button>
              ` : `
                <div class="flex items-center gap-2">
                  <div class="flex items-center bg-slate-900/90 border border-slate-700 rounded-xl overflow-hidden px-1 py-0.5">
                    <button type="button" class="btn-qty-minus px-2.5 py-2 text-gray-300 hover:text-white font-black text-sm" data-prod-id="${prod.id}">-</button>
                    <input type="number" id="input-qty-${prod.id}" value="1" min="1" max="${prod.quantity}" class="w-10 text-center bg-transparent text-white font-code font-bold text-sm focus:outline-none" />
                    <button type="button" class="btn-qty-plus px-2.5 py-2 text-gray-300 hover:text-white font-black text-sm" data-prod-id="${prod.id}">+</button>
                  </div>
                  <button data-prod-id="${prod.id}" class="btn-add-to-cart flex-1 py-3 bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-600 hover:opacity-95 text-white font-extrabold rounded-xl text-xs sm:text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                    <span>أضف للسلة</span>
                  </button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      // Quantity Steppers
      grid.querySelectorAll('.btn-qty-minus').forEach(btn => {
        btn.onclick = () => {
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          if (input) {
            let val = parseInt(input.value, 10) || 1;
            if (val > 1) input.value = val - 1;
          }
        };
      });

      grid.querySelectorAll('.btn-qty-plus').forEach(btn => {
        btn.onclick = () => {
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          const prod = products.find(p => p.id === btn.dataset.prodId);
          if (input && prod) {
            let val = parseInt(input.value, 10) || 1;
            if (val < prod.quantity) input.value = val + 1;
          }
        };
      });

      // Add To Cart Button
      grid.querySelectorAll('.btn-add-to-cart').forEach(btn => {
        btn.onclick = () => {
          const prod = products.find(p => p.id === btn.dataset.prodId);
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          const qty = input ? (parseInt(input.value, 10) || 1) : 1;
          if (prod) addToCart(prod, qty);
        };
      });
    }

    renderStoreGrid();

    // Category button switching
    catButtons.forEach(btn => {
      btn.onclick = () => {
        catButtons.forEach(b => {
          b.className = 'storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-gray-300 hover:text-white border border-slate-800 whitespace-nowrap transition';
        });
        btn.className = 'storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-600 text-white shadow-md shadow-cyan-600/20 whitespace-nowrap transition';
        selectedCategory = btn.dataset.cat;
        renderStoreGrid();
      };
    });

    // Cart Button Trigger
    const btnOpenCart = document.getElementById('btn-open-cart-checkout');
    if (btnOpenCart) {
      btnOpenCart.onclick = () => openCartModal(store, cart, updateCartBar);
    }
  }

  function openCartModal(store, cart, onCartChange = () => {}) {
    // Remove any existing cart modal
    const oldModal = document.getElementById('customer-cart-modal');
    if (oldModal) oldModal.remove();

    function renderCartModalContent() {
      const modalBox = document.getElementById('customer-cart-modal-box');
      if (!modalBox) return;

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      if (cart.length === 0) {
        modalBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="shopping-cart" class="w-5 h-5 text-cyan-400"></i>
              <span>سلة المشتريات (${store.name})</span>
            </h3>
            <button id="btn-close-cart-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="py-12 text-center text-gray-400 space-y-3">
            <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto text-gray-600"></i>
            <p class="font-bold">سلة المشتريات فارغة حالياً</p>
            <button id="btn-close-empty-cart" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold">تصفح المنتجات</button>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        document.getElementById('btn-close-cart-modal')?.addEventListener('click', () => {
          document.getElementById('customer-cart-modal')?.remove();
        });
        document.getElementById('btn-close-empty-cart')?.addEventListener('click', () => {
          document.getElementById('customer-cart-modal')?.remove();
        });
        return;
      }

      modalBox.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <i data-lucide="shopping-cart" class="w-5 h-5 text-cyan-400"></i>
            <h3 class="text-base font-bold text-white">سلة المشتريات وإتمام الطلب</h3>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-cyan-500/20 text-cyan-300 font-code">${totalCount} قطع</span>
          </div>
          <button id="btn-close-cart-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <!-- Items List -->
        <div class="space-y-3 max-h-56 overflow-y-auto pr-1">
          ${cart.map((item, idx) => `
            <div class="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-3 min-w-0">
                <img src="${item.imageUrl || window.DEFAULT_PRODUCT_IMG}" class="w-12 h-12 rounded-xl object-cover border border-slate-700 bg-slate-950 flex-shrink-0" onerror="this.onerror=null; this.src=window.DEFAULT_PRODUCT_IMG;" />
                <div class="min-w-0">
                  <div class="font-bold text-white truncate">${item.title}</div>
                  <div class="text-[11px] text-gray-400 font-code mt-0.5">${item.price} ${store.currency || 'ج.م'} للقطعة</div>
                </div>
              </div>

              <div class="flex items-center gap-3 flex-shrink-0">
                <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg overflow-hidden">
                  <button type="button" class="btn-cart-dec px-2 py-1 text-gray-300 hover:text-white font-bold" data-index="${idx}">-</button>
                  <span class="w-7 text-center font-code font-bold text-white text-xs">${item.quantity}</span>
                  <button type="button" class="btn-cart-inc px-2 py-1 text-gray-300 hover:text-white font-bold" data-index="${idx}">+</button>
                </div>
                <span class="font-code text-cyan-300 font-bold w-16 text-left">${item.price * item.quantity} ${store.currency || 'ج.م'}</span>
                <button type="button" class="btn-cart-del p-1 text-rose-400 hover:text-rose-300" data-index="${idx}" title="حذف"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Total Price Summary -->
        <div class="p-3.5 bg-slate-900 rounded-2xl border border-cyan-500/30 flex items-center justify-between text-xs sm:text-sm">
          <span class="font-bold text-gray-200">الإجمالي النهائي للطلب:</span>
          <span class="font-code font-black text-emerald-400 text-base">${totalAmount} ${store.currency || 'ج.م'}</span>
        </div>

        <!-- Checkout Form -->
        <form id="customer-checkout-form" class="space-y-3.5 border-t border-slate-800 pt-3">
          <div>
            <label class="block text-xs font-bold text-gray-200 mb-1">ID حسابك في اللعبة / الخدمة *</label>
            <input type="text" id="checkout-customer-id" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500 text-sm" placeholder="مثال: 984521741 أو المعرف الخاص بك" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-200 mb-1">رقم هاتف التواصل (واتساب) *</label>
            <input type="tel" id="checkout-customer-phone" required maxlength="11" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500 text-sm" placeholder="مثال: 01012345678" />
            <span class="text-[10px] text-gray-400 mt-1 block">رقم مصري يبدأ بـ 010 أو 011 أو 012 أو 015 ومكون من 11 رقماً</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">ملاحظات إضافية (اختياري)</label>
            <textarea id="checkout-customer-notes" rows="2" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-xs" placeholder="أي تفاصيل إضافية تريد إبلاغ التاجر بها..."></textarea>
          </div>

          <button type="submit" id="btn-submit-order" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 hover:opacity-95 text-white font-black text-base rounded-2xl shadow-xl shadow-teal-500/20 transition flex items-center justify-center gap-2">
            <span>تأكيد وإرسال الطلب (${totalAmount} ${store.currency || 'ج.م'})</span>
            <i data-lucide="check-circle" class="w-5 h-5 text-amber-300"></i>
          </button>
        </form>
      `;

      if (window.lucide) window.lucide.createIcons();

      // Handlers
      document.getElementById('btn-close-cart-modal').onclick = () => {
        document.getElementById('customer-cart-modal').remove();
      };

      modalBox.querySelectorAll('.btn-cart-dec').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            if (cart[idx].quantity > 1) {
              cart[idx].quantity--;
            } else {
              cart.splice(idx, 1);
            }
            onCartChange();
            renderCartModalContent();
          }
        };
      });

      modalBox.querySelectorAll('.btn-cart-inc').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            if (cart[idx].quantity < cart[idx].maxStock) {
              cart[idx].quantity++;
              onCartChange();
              renderCartModalContent();
            } else {
              Swal.fire({ icon: 'info', title: 'أقصى كمية', text: `الكمية المتوفرة بالمخزون هي ${cart[idx].maxStock} قطعة فقط.` });
            }
          }
        };
      });

      modalBox.querySelectorAll('.btn-cart-del').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            cart.splice(idx, 1);
            onCartChange();
            renderCartModalContent();
          }
        };
      });

      // Checkout form submit
      const form = document.getElementById('customer-checkout-form');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const customerId = document.getElementById('checkout-customer-id').value.trim();
          const customerPhone = document.getElementById('checkout-customer-phone').value.trim();
          const notes = document.getElementById('checkout-customer-notes').value.trim();

          if (!customerId) {
            Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى كتابة ID حسابك' });
            return;
          }

          if (!isValidEgyptianPhone(customerPhone)) {
            Swal.fire({
              icon: 'warning',
              title: 'رقم هاتف غير صحيح',
              text: 'رقم الهاتف يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون مكوناً من 11 رقماً.'
            });
            return;
          }

          const submitBtn = document.getElementById('btn-submit-order');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>جاري إرسال الطلب...</span>`;

          try {
            const order = await createOrder({
              storeId: store.id,
              items: [...cart],
              customerId,
              customerWhatsapp: customerPhone,
              notes
            });

            // Empty cart
            cart.length = 0;
            onCartChange();

            // Close modal
            document.getElementById('customer-cart-modal').remove();

            if (window.confetti) window.confetti({ particleCount: 90, spread: 80 });

            // Compose direct message text
            let itemsText = order.items.map(it => `• ${it.title} (العدد: ${it.quantity}) - ${(it.quantity * it.price)} ${store.currency || 'ج.م'}`).join('\n');
            let fullMsg = `مرحباً إدارة متجر ${store.name} 👋\nأريد تأكيد وتنفيذ طلبي:\n📋 رقم الطلب: #${order.id}\n👤 آيدي الحساب: ${customerId}\n📱 هاتف العميل: ${customerPhone}\n📦 المنتجات المطلوبة:\n${itemsText}\n💰 الإجمالي: ${order.totalPrice} ${store.currency || 'ج.م'}`;
            if (notes) fullMsg += `\n📝 ملاحظات: ${notes}`;

            const waDirectLink = store.whatsapp ? formatEgyptianWaLink(store.whatsapp, fullMsg) : '';
            const tgDirectLink = store.telegram ? formatTelegramLink(store.telegram, fullMsg) : '';

            Swal.fire({
              icon: 'success',
              title: '🎉 تم إرسال طلبك بنجاح!',
              html: `
                <div class="text-right text-sm space-y-4 mt-2">
                  <div class="p-3 bg-slate-900 rounded-xl border border-emerald-500/30 text-xs">
                    <div class="text-gray-400">رقم الطلب الخاص بك:</div>
                    <div class="text-cyan-400 font-code font-bold text-sm mt-0.5">#${order.id}</div>
                  </div>

                  <div class="p-4 bg-slate-900/90 rounded-2xl border border-cyan-500/30 text-xs space-y-2">
                    <div class="font-bold text-white text-sm">أرسل لنا رسالة لتأكيد وتنفيذ طلبك:</div>
                    <p class="text-gray-300 leading-relaxed">
                      يرجى الضغط على الزر أدناه لإرسال تفاصيل طلبك مباشرة للتاجر للبدء الفوري في التسليم:
                    </p>
                  </div>

                  <div class="space-y-2.5 pt-1">
                    ${waDirectLink ? `
                      <a href="${waDirectLink}" target="_blank" class="block w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs sm:text-sm text-center shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        <span>إرسال تفاصيل الطلب عبر واتساب 💬</span>
                      </a>
                    ` : ''}

                    ${tgDirectLink ? `
                      <a href="${tgDirectLink}" target="_blank" class="block w-full py-3.5 px-4 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-bold text-xs sm:text-sm text-center shadow-lg shadow-sky-600/30 transition flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span>إرسال تفاصيل الطلب عبر تليجرام ✈️</span>
                      </a>
                    ` : ''}
                  </div>
                </div>
              `,
              showConfirmButton: true,
              confirmButtonText: 'إغلاق ومتابعة التسوق'
            });

            if (window.lucide) window.lucide.createIcons();

          } catch (err) {
            Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>تأكيد وإرسال الطلب</span>`;
          }
        };
      }
    }

    const modalHtml = `
      <div id="customer-cart-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div id="customer-cart-modal-box" class="glass-panel w-full max-w-lg p-6 sm:p-8 rounded-3xl border border-cyan-500/30 text-right space-y-4 max-h-[90vh] overflow-y-auto">
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    renderCartModalContent();
  }

  // =========================================================================
  // 14. Global Event Delegation & Initialization
  // =========================================================================
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      const href = link.getAttribute('href');
      if (href) {
        e.preventDefault();
        window.location.hash = href;
        navigate(href);
      }
    }
  });

  window.addEventListener('hashchange', () => navigate());
  window.addEventListener('popstate', () => navigate());

  // Execute immediately
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => navigate());
  } else {
    navigate();
  }

})();

  </script>
</body>
</html>
