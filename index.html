  // Realtime Database Universal Adapter
  function createRtdbAdapter(rtdb) {
    return {
      collection(colName) {
        return {
          doc(docId) {
            const self = {
              async set(data) {
                return rtdb.ref(`${colName}/${docId}`).set(data);
              },
              async get() {
                const snap = await rtdb.ref(`${colName}/${docId}`).get();
                return {
                  exists: snap.exists(),
                  id: docId,
                  data: () => snap.val() || {}
                };
              },
              async update(updates) {
                return rtdb.ref(`${colName}/${docId}`).update(updates);
              },
              async delete() {
                return rtdb.ref(`${colName}/${docId}`).remove();
              }
            };
            return self;
          },
          async get() {
            const snap = await rtdb.ref(colName).get();
            const docs = [];
            if (snap.exists()) {
              snap.forEach(child => {
                docs.push({
                  id: child.key,
                  data: () => child.val() || {}
                });
              });
            }
            return {
              forEach: (cb) => docs.forEach(cb),
              docs,
              empty: docs.length === 0
            };
          },
          where(field, op, val) {
            return {
              async get() {
                const snap = await rtdb.ref(colName).get();
                const docs = [];
                if (snap.exists()) {
                  snap.forEach(child => {
                    const data = child.val() || {};
                    if (data[field] === val) {
                      docs.push({
                        id: child.key,
                        data: () => data
                      });
                    }
                  });
                }
                return {
                  forEach: (cb) => docs.forEach(cb),
                  docs,
                  empty: docs.length === 0
                };
              }
            };
          }
        };
      },
      batch() {
        const batchOps = [];
        return {
          set(docRef, data) {
            batchOps.push(docRef.set(data));
          },
          async commit() {
            await Promise.all(batchOps);
          }
        };
      }
    };
  }

  try {
    if (window.firebase) {
      if (!window.firebase.apps.length) {
        fbApp = window.firebase.initializeApp(firebaseConfig);
      } else {
        fbApp = window.firebase.app();
      }
      fbAuth = window.firebase.auth();

      if (window.firebase.database) {
        const rtdb = window.firebase.database();
        fbDb = createRtdbAdapter(rtdb);
        console.log('✅ Connected to Firebase Realtime Database');
      } else if (window.firebase.firestore) {
        fbDb = window.firebase.firestore();
      }
      fbStorage = window.firebase.storage();
    }
  } catch (err) {
    console.warn('⚠️ Firebase initial connection note:', err.message);
  }

  // Helper with network timeout
  async function withTimeout(promise, ms = 3000) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase timeout - using local storage')), ms))
    ]);
  }

  // =========================================================================
  // 2. LocalStorage Resilient Adapter
  // =========================================================================
  const LOCAL_PREFIX = 'msn3_store_factory_';

  function getLocalData(key, defaultVal = []) {

      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      return raw ? JSON.parse(raw) : defaultVal;
    } catch (e) {
      return defaultVal;
    }
  }

  function setLocalData(key, val) {
    try {
      localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(val));
    } catch (e) {

  const DEFAULT_PRODUCT_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22400%22%20viewBox%3D%220%200%20300%20400%22%3E%3Crect%20fill%3D%22%23090d16%22%20width%3D%22300%22%20height%3D%22400%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22260%22%20height%3D%22360%22%20rx%3D%2220%22%20fill%3D%22%230f172a%22%20stroke%3D%22%231e293b%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22160%22%20r%3D%2242%22%20fill%3D%22%231e293b%22%20stroke%3D%22%2306b6d4%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%224%204%22%2F%3E%3Cpath%20d%3D%22M136%20160%20l10%2010%2018-18%22%20stroke%3D%22%2306b6d4%22%20stroke-width%3D%223%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Ctext%20x%3D%22150%22%20y%3D%22235%22%20fill%3D%22%2338bdf8%22%20font-family%3D%22sans-serif%22%20font-size%3D%2214%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%3E%D8%B5%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D9%85%D9%86%D8%AA%D8%AC%3C%2Ftext%3E%3Ctext%20x%3D%22150%22%20y%3D%22258%22%20fill%3D%22%2364748b%22%20font-family%3D%22sans-serif%22%20font-size%3D%2211%22%20text-anchor%3D%22middle%22%3E%D9%85%D8%AA%D8%AC%D8%B1%20%D8%AE%D8%A7%D8%B5%3C%2Ftext%3E%3C%2Fsvg%3E";

  window.DEFAULT_STORE_LOGO = DEFAULT_STORE_LOGO;

  async function compressImage(file, maxWidth = 700, maxHeight = 700, quality = 0.85) {
    if (!file || !file.type || !file.type.startsWith('image/')) return file;
    if (file.type === 'image/svg+xml' || file.type === 'image/gif') return file;

    return new Promise((resolve) => {
      const img = new Image();
      const tempUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(tempUrl);
        let { width, height } = img;
        if (width > maxWidth || height > maxHeight) {
          const ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          if (!blob) {
            resolve(file);
          } else {
            const compressed = new File([blob], (file.name || 'image').replace(/\.[^/.]+$/, "") + ".jpg", {
              type: 'image/jpeg',
              lastModified: Date.now()
            });
            resolve(compressed);
          }
        }, 'image/jpeg', quality);
      };
      img.onerror = () => {
        URL.revokeObjectURL(tempUrl);
        resolve(file);
      };
      img.src = tempUrl;
    });
  }

  // Converts any file to an optimized permanent Base64 Data URL (~50KB) that works 100% offline & across reloads
  async function fileToDataUrl(file, maxWidth = 800, maxHeight = 1066) {
    try {
      const compressed = await compressImage(file, maxWidth, maxHeight, 0.8);
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(DEFAULT_PRODUCT_IMG);
        reader.readAsDataURL(compressed);
      });
    } catch (e) {
      return DEFAULT_PRODUCT_IMG;
    }
  }

  // Egyptian Mobile Validator (Starts with 010, 011, 012, 015 - exactly 11 digits)
  function isValidEgyptianPhone(phone) {
    if (!phone) return false;
    const clean = phone.trim().replace(/[\s-]/g, '');
    return /^(010|011|012|015)[0-9]{8}$/.test(clean);
  }

  async function uploadImageToCatbox(file, onProgress = () => {}) {
    if (!file) throw new Error('يرجى اختيار صورة صالحة');
    if (!file.type || !file.type.startsWith('image/')) throw new Error('الملف المختار ليس صورة');

    onProgress('جاري تحسين وضغط الصورة...');
    const optimizedFile = await compressImage(file);

    onProgress('جاري رفع الصورة إلى السيرفر السحابي...');

    // 1. Catbox upload via CORS proxy
    try {
      const fd = new FormData();
      fd.append('reqtype', 'fileupload');
      fd.append('fileToUpload', optimizedFile);

      const target = 'https://catbox.moe/user/api.php';
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(target);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      const res = await fetch(proxyUrl, {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.ok) {
        const text = (await res.text()).trim();
        if (text.startsWith('http://') || text.startsWith('https://')) {
          const secureUrl = text.replace(/^http:\/\//, 'https://');
          onProgress('تم رفع الصورة بنجاح!');
          return secureUrl;
        }
      }
    } catch (err) {
      console.warn('Proxy upload attempt 1 failed:', err.message);
    }

    // 2. Direct Catbox upload (if supported by environment)
    try {
      const fd = new FormData();
      fd.append('reqtype', 'fileupload');
      fd.append('fileToUpload', optimizedFile);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      const directRes = await fetch('https://catbox.moe/user/api.php', {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (directRes.ok) {
        const text = (await directRes.text()).trim();
        if (text.startsWith('http://') || text.startsWith('https://')) {
          const secureUrl = text.replace(/^http:\/\//, 'https://');
          onProgress('تم رفع الصورة بنجاح!');
          return secureUrl;
        }
      }
    } catch (err) {
      console.warn('Direct upload failed:', err.message);
    }

    // 3. Fallback: Secondary Cloud Host (FreeImage.host API)
    try {
      onProgress('جاري الحفظ عبر السيرفر الاحتياطي...');
      const fd = new FormData();
      fd.append('key', '6d207e02198a847aa98d0a2a901485a5');
      fd.append('action', 'upload');
      fd.append('source', optimizedFile);
      fd.append('format', 'json');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      const secRes = await fetch('https://freeimage.host/api/1/upload', {
        method: 'POST',
        body: fd,
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (secRes.ok) {
        const json = await secRes.json();
        if (json && json.image && json.image.url) {
          onProgress('تم رفع الصورة بنجاح!');
          return json.image.url;
        }
      }
    } catch (err) {
      console.warn('Secondary cloud failed:', err.message);
    }

    // 4. Safe compressed Data URL fallback (never fails, instant, fits within limits)
    onProgress('تم حفظ الصورة بنجاح!');
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(optimizedFile);
    });
  }

  // Validate Code
  async function validateActivationCode(codeStr) {
    if (!codeStr || !codeStr.trim()) {
      return { valid: false, error: 'يرجى إدخال كود التفعيل' };
    }
    const clean = codeStr.trim().toUpperCase();

    // Check Firestore
    if (fbDb) {
      try {
        const snapshot = await withTimeout(
          fbDb.collection('activation_codes').where('code', '==', clean).get(),
          2500
        );
        if (!snapshot.empty) {
          const docSnap = snapshot.docs[0];
          const data = docSnap.data();
          if (data.isUsed) {
            return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${data.usedByStoreName || 'آخر'}"` };
          }
          return { valid: true, durationDays: data.durationDays || 30, codeData: data };
        }
      } catch (e) {
        console.warn('Firestore code check note:', e.message);
      }
    }

    // Check Local
    const localCodes = getLocalData('codes', []);
    const found = localCodes.find(c => c.code.toUpperCase() === clean);
    if (found) {
      if (found.isUsed) {
        return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${found.usedByStoreName || 'آخر'}"` };
      }
      return { valid: true, durationDays: found.durationDays || 30, codeData: found };
    }

    return { valid: false, error: 'كود التفعيل غير صحيح أو غير موجود بالنظام' };
  }

    const cleanSlug = slug.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
    const now = Date.now();
    const durationMs = durationDays * 24 * 60 * 60 * 1000;
    const expiresAt = now + durationMs;
    const storeId = cleanSlug || `store_${Date.now()}`;

    const storeData = {
      id: storeId,
      ownerUid,
      ownerEmail,
      name: storeName.trim(),
      slug: cleanSlug,
      logoUrl: logoUrl || DEFAULT_STORE_LOGO,
      whatsapp: whatsapp ? whatsapp.trim().replace(/[^0-9+]/g, '') : '',
      telegram: telegram ? telegram.trim().replace(/^@/, '') : '',
      currency: currency.trim() || 'ج.م',
      bio: bio.trim(),
      themeColor: themeColor || 'cyan',
      completedDealsCount: parseInt(completedDealsCount, 10) || 0,
      categories: ['عام'],
      activationCode: activationCode.toUpperCase(),
      durationDays: durationDays,
      createdAt: now,
      activatedAt: now,
      expiresAt: expiresAt,
      status: 'active'
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('stores').doc(storeId).set(storeData), 2500);
      } catch (e) {}
    }

    const localStores = getLocalData('stores', []);
    const idx = localStores.findIndex(s => s.id === storeId || s.slug === cleanSlug);
    if (idx >= 0) localStores[idx] = storeData;
    else localStores.unshift(storeData);
    setLocalData('stores', localStores);

    await markCodeAsUsed(activationCode, storeId, storeName);

  // Format WhatsApp Link (Handles Egyptian phone numbers starting with 010, 011, 012, 015)
  function formatEgyptianWaLink(rawPhone, messageText = '') {
    if (!rawPhone) return '';
    let digits = rawPhone.replace(/[^0-9]/g, '');
    if (digits.length === 11 && digits.startsWith('01')) {
      digits = '2' + digits; // Format as 2010...
    }
    const textQuery = messageText ? `?text=${encodeURIComponent(messageText)}` : '';

  // Format Telegram Link (Username, link, or channel)
  function formatTelegramLink(rawTg, messageText = '') {
    if (!rawTg) return '';
    let clean = rawTg.trim();
    if (clean.startsWith('http://') || clean.startsWith('https://')) {
      return clean;
    }
    if (clean.startsWith('t.me/')) {
      return `https://${clean}`;
    }
    if (clean.startsWith('@')) {
      clean = clean.slice(1);
    }
    return `https://t.me/${clean}`;
  }

  // Subscription Time Remaining
  function getSubscriptionTimeRemaining(expiresAt) {
    const diff = (expiresAt || 0) - Date.now();
    if (diff <= 0) {
      return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0, formatted: 'منتهي الصلاحية' };
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    let formatted = '';
    if (days > 0) formatted += `${days} يوم و `;
    formatted += `${hours} ساعة و ${minutes} دقيقة`;

    return { expired: false, days, hours, minutes, seconds, formatted };
  }

  // Renew Store Subscription
  async function renewStoreSubscription(storeId, newCodeStr) {
    const validation = await validateActivationCode(newCodeStr);
    if (!validation.valid) throw new Error(validation.error);

    const store = await getStoreById(storeId);
    if (!store) throw new Error('المتجر غير موجود');

    const now = Date.now();
    const additionalMs = validation.durationDays * 24 * 60 * 60 * 1000;
    const baseTime = (store.expiresAt && store.expiresAt > now) ? store.expiresAt : now;
    const newExpiresAt = baseTime + additionalMs;

    const updates = {
      expiresAt: newExpiresAt,
      durationDays: (store.durationDays || 0) + validation.durationDays,
      status: 'active',
      lastRenewedAt: now,
      lastRenewCode: newCodeStr.trim().toUpperCase()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('stores').doc(storeId).update(updates), 2500);
      } catch (e) {}
    }

    const localStores = getLocalData('stores', []);
    const target = localStores.find(s => s.id === storeId);
    if (target) {
      Object.assign(target, updates);
      setLocalData('stores', localStores);
    }

    await markCodeAsUsed(newCodeStr, storeId, store.name);
    return { success: true, newExpiresAt, addedDays: validation.durationDays };
  }

  // Orders & Deals CRUD (Supports Multi-item Shopping Cart + Single Item fallback)
  async function createOrder({ storeId, items = [], productId, productTitle, productPrice, orderQuantity = 1, customerId, customerWhatsapp, notes = '' }) {
    const orderId = `ORD-${Date.now().toString().slice(-6)}-${Math.floor(Math.random() * 900 + 100)}`;
    
    // Normalize items array
    let orderItems = Array.isArray(items) && items.length > 0 ? items.map(it => ({
      productId: it.productId || it.id,
      title: it.title || it.productTitle || '',
      price: parseFloat(it.price || it.productPrice) || 0,
      quantity: parseInt(it.quantity || it.orderQuantity, 10) || 1,
      category: it.category || 'عام',
      imageUrl: it.imageUrl || ''
    })) : [];

    // Fallback if single product was passed
    if (orderItems.length === 0 && (productId || productTitle)) {
      orderItems.push({
        productId: productId || '',
        title: productTitle || '',
        price: parseFloat(productPrice) || 0,
        quantity: parseInt(orderQuantity, 10) || 1,
        category: 'عام',
        imageUrl: ''
      });
    }

    const calculatedTotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const totalQty = orderItems.reduce((sum, item) => sum + item.quantity, 0);
    const summaryTitle = orderItems.map(item => `${item.title} (x${item.quantity})`).join(' + ');

    const orderData = {
      id: orderId,
      storeId,
      items: orderItems,
      // Backward-compatible fields
      productId: orderItems[0] ? orderItems[0].productId : (productId || ''),
      productTitle: summaryTitle || productTitle || '',
      productPrice: orderItems[0] ? orderItems[0].price : (parseFloat(productPrice) || 0),
      orderQuantity: totalQty,
      totalPrice: calculatedTotal,
      customerId: (customerId || '').trim(),
      customerWhatsapp: (customerWhatsapp || '').trim().replace(/[^0-9+]/g, ''),
      notes: (notes || '').trim(),
      status: 'pending',
      createdAt: Date.now(),
      completedAt: null
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('orders').doc(orderId).set(orderData), 2500);
      } catch (e) {}
    }

    const localOrders = getLocalData('orders', []);
    localOrders.unshift(orderData);
    setLocalData('orders', localOrders);
    return orderData;
  }

  async function getStoreOrders(storeId) {
    let list = [];
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('orders').where('storeId', '==', storeId).get(), 2500);
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      } catch (e) {}
    }
    const localOrders = getLocalData('orders', []).filter(o => o.storeId === storeId);
    const map = new Map();
    localOrders.forEach(o => map.set(o.id, o));
    list.forEach(o => map.set(o.id, o));
    return Array.from(map.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  // Complete Deal: Only decrease quantity when marked completed! (Supports multiple items in an order)
  async function completeDeal(orderId, storeId) {
    let order = null;
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('orders').doc(orderId).get(), 2000);
        if (snap.exists) order = snap.data();
      } catch (e) {}
    }
    if (!order) {
      const localOrders = getLocalData('orders', []);
      order = localOrders.find(o => o.id === orderId);
    }
    if (!order) throw new Error('الطلب غير موجود');
    if (order.status === 'completed') throw new Error('الصفقة مكتملة بالفعل مسبقاً');

    // Determine list of items to deduct
    const itemsToDeduct = (Array.isArray(order.items) && order.items.length > 0)
      ? order.items
      : [{ productId: order.productId, quantity: order.orderQuantity || 1 }];

    const localProducts = getLocalData('products', []);
    let totalDeducted = 0;

    for (const item of itemsToDeduct) {
      const pId = item.productId;
      const qty = parseInt(item.quantity, 10) || 1;
      if (!pId) continue;

      let product = null;
      if (fbDb) {
        try {
          const pSnap = await withTimeout(fbDb.collection('products').doc(pId).get(), 2000);
          if (pSnap.exists) product = pSnap.data();
        } catch (e) {}
      }
      if (!product) {
        product = localProducts.find(p => p.id === pId);
      }

      if (product) {
        const newQty = Math.max(0, (parseInt(product.quantity, 10) || 0) - qty);
        if (fbDb) {
          try {
            await withTimeout(fbDb.collection('products').doc(pId).update({ quantity: newQty }), 2000);
          } catch (e) {}
        }
        const pTarget = localProducts.find(p => p.id === pId);
        if (pTarget) {
          pTarget.quantity = newQty;
        }
        totalDeducted += qty;
      }
    }
    setLocalData('products', localProducts);

    const orderUpdates = { status: 'completed', completedAt: Date.now() };
    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('orders').doc(orderId).update(orderUpdates), 2000);
      } catch (e) {}
    }
    const localOrders = getLocalData('orders', []);
    const oTarget = localOrders.find(o => o.id === orderId);
    if (oTarget) {
      Object.assign(oTarget, orderUpdates);
      setLocalData('orders', localOrders);
    }

    // Increment store's completed deals counter
    try {
      const store = await getStoreById(storeId);
      if (store) {
        const nextDeals = (parseInt(store.completedDealsCount, 10) || 0) + 1;
        await updateStoreSettings(storeId, { completedDealsCount: nextDeals });
      }
    } catch (e) {}

    return { success: true, orderId, deducted: totalDeducted };
  }

  async function getPresetImages() {
    let list = [];
    let fbSuccess = false;
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('preset_images').get(), 4000);
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        fbSuccess = true;
      } catch (e) {
        console.warn('Firebase preset_images fetch error:', e);
      }
    }

    if (fbSuccess) {
      if (list.length === 0) {
        // If cloud collection is brand new, seed defaults to Firestore
        try {
          const batch = fbDb.batch();
          DEFAULT_PRESET_IMAGES.forEach(img => {
            const ref = fbDb.collection('preset_images').doc(img.id);
            batch.set(ref, img);
          });
          await batch.commit();
          list = [...DEFAULT_PRESET_IMAGES];
        } catch (seedErr) {
          list = [...DEFAULT_PRESET_IMAGES];
        }
      }
      // Cloud is authoritative: update local storage cache to match cloud exactly
      setLocalData(PRESET_IMAGES_STORAGE_KEY, list);
      return list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

    // Fallback to local storage if offline or permission denied
    let localPresets = getLocalData(PRESET_IMAGES_STORAGE_KEY, null);
    if (!localPresets || !localPresets.length) {
      localPresets = [...DEFAULT_PRESET_IMAGES];
      setLocalData(PRESET_IMAGES_STORAGE_KEY, localPresets);
    }
    return localPresets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  function getAdminPasskey() {
    return localStorage.getItem(ADMIN_PASSKEY_STORAGE) || DEFAULT_ADMIN_PASSKEY;

  function setAdminPasskey(newKey) {
    if (newKey && newKey.trim().length >= 6) {
      localStorage.setItem(ADMIN_PASSKEY_STORAGE, newKey.trim());
      return true;
    }
    return false;
  }
  function verifyAdmin(passkey) {
    if (passkey && passkey.trim() === getAdminPasskey()) {
      sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
      return true;
    }
    return false;
  }
  function isAdminLoggedIn() {
    return sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true';

    sessionStorage.removeItem(ADMIN_SESSION_KEY);

  async function registerMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.createUserWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          try {
            const lCred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
            uid = lCred.user.uid;
          } catch (err) {
            throw new Error('هذا البريد مسجل مسبقاً، يرجى تسجيل الدخول أو اختيار بريد آخر.');
          }
        }
      }
    }
    if (!uid) {
      uid = `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
    }

    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  async function loginMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {}
    }
    if (!uid) {
      const store = await getStoreByOwner(null, cleanEmail);
      if (store) {
        uid = store.ownerUid || `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
      } else {
        throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة، أو المتجر غير مسجل.');
      }
    }
    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  function getCurrentMerchant() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  async function logoutMerchant() {
    if (fbAuth) {
      try { await fbAuth.signOut(); } catch (e) {}
    }
    localStorage.removeItem(SESSION_KEY);
  }

  // =========================================================================
  // 7. Router & View Orchestrator
  // =========================================================================
  let activeStore = null;
  let countdownInterval = null;

  function parseCurrentRoute() {
    const hash = window.location.hash.replace(/^#\/?/, '').trim();
    if (hash === 'admin') return { view: 'admin' };
    if (hash === 'merchant' || hash === 'login') return { view: 'merchant' };
    if (hash === 'register' || hash === 'create') return { view: 'register' };

    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    if (storeParam) {
      return { view: 'store', slug: storeParam.trim().toLowerCase() };
    }

    if (hash.startsWith('store/')) {
      const slug = hash.replace('store/', '').trim().toLowerCase();
      return { view: 'store', slug };
    }

    // Subdomain check
    const host = window.location.hostname.toLowerCase();
    if (host.endsWith('stores.privateee.online') && host !== 'stores.privateee.online') {
      const sub = host.split('.')[0];
      if (sub && sub !== 'www') return { view: 'store', slug: sub };
    }

    if (hash && !['home', 'contact', 'about', 'store-products', 'store-trades'].includes(hash)) {
      return { view: 'store', slug: hash.toLowerCase() };
    }

    return { view: 'landing' };
  }

  async function navigate(targetHash = null) {
    if (targetHash !== null) {
      if (window.location.hash !== targetHash) {
        window.location.hash = targetHash;
        return;
      }
    }

    const route = parseCurrentRoute();
    const mainContainer = document.getElementById('main-content');

    if (!mainContainer) return;
    mainContainer.innerHTML = '';

    switch (route.view) {
      case 'store':
        renderNavbarForStore({ name: route.slug, slug: route.slug }, 0);
        mainContainer.innerHTML = `<div id="storefront-container"></div>`;
        initStorefront(route.slug, document.getElementById('storefront-container'));
        break;

      case 'admin':
        renderNavbarDefault();
        updateNavHighlight('admin');
        mainContainer.innerHTML = `<div id="admin-container"></div>`;
        renderAdminView();
        break;

      case 'merchant':
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('dashboard');
        break;

      case 'register':
        renderNavbarDefault();
        updateNavHighlight('register');
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('register');
        break;

      case 'landing':
      default:
        renderNavbarDefault();
        updateNavHighlight('home');
        renderLandingPage(mainContainer);
        break;
    }

    window.scrollTo(0, 0);
    if (window.lucide) window.lucide.createIcons();
  }

    if (!currentMerchant) {
      renderMerchantLogin(container);
      return;
    }

    getStoreByOwner(currentMerchant.uid, currentMerchant.email).then(store => {
      activeStore = store;

        renderMerchantRegistration(container, currentMerchant);
        return;
      }

      const timeRemaining = getSubscriptionTimeRemaining(activeStore.expiresAt);
      if (timeRemaining.expired || activeStore.status === 'expired') {

      }

      renderMerchantDashboard(container, activeStore);

              <button id="btn-copy-store-url" class="p-1 hover:text-white transition" title="نسخ الرابط"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>

              <i data-lucide="external-link" class="w-4 h-4"></i>

      if (rem.expired) {
        clearInterval(countdownInterval);
        renderExpiredSubscriptionScreen(container, store);
      } else {
        countdownEl.textContent = rem.formatted;
      }
    }
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);

    document.getElementById('btn-copy-store-url').onclick = () => {

      await logoutMerchant();

    };

      promptRenewalModal(store, () => renderMerchantDashboard(container, store));
    };

    const contentArea = document.getElementById('merchant-dashboard-content');
    const tabProd = document.getElementById('merchant-tab-products');
    const tabTrades = document.getElementById('merchant-tab-trades');
    const tabOrders = document.getElementById('merchant-tab-orders');
    const tabSettings = document.getElementById('merchant-tab-settings');

    function setActive(activeBtn) {
      [tabProd, tabTrades, tabOrders, tabSettings].forEach(b => {
        b.classList.remove('text-cyan-400', 'border-b-2', 'border-cyan-500');
        b.classList.add('text-gray-400');
      });
      activeBtn.classList.add('text-cyan-400', 'border-b-2', 'border-cyan-500');
      activeBtn.classList.remove('text-gray-400');
    }

    tabProd.onclick = () => { setActive(tabProd); renderProductsTab(contentArea, store); };
    tabTrades.onclick = () => { setActive(tabTrades); renderTradesTab(contentArea, store); };
    tabOrders.onclick = () => { setActive(tabOrders); renderOrdersTab(contentArea, store); };
    tabSettings.onclick = () => { setActive(tabSettings); renderSettingsTab(contentArea, store); };

    renderProductsTab(contentArea, store);
  }

  // Products Tab (With Category Management & Rating Display)
  async function renderProductsTab(contentDiv, store) {
    if (!store.categories || !store.categories.length) {
      store.categories = ['عام'];
    }

    contentDiv.innerHTML = `
      <div class="space-y-6">
        
        <!-- Category Manager Card -->
        <div class="glass-panel p-5 sm:p-6 rounded-3xl border border-slate-800 space-y-4">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800/80 pb-3">
            <div>
              <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="layers" class="w-5 h-5 text-cyan-400"></i>
                <span>إدارة أقسام المتجر</span>

              <input 
                type="text" 
                id="new-category-input"

                id="btn-add-category" 
                class="px-4 py-2 bg-gradient-to-r from-cyan-600 to-teal-600 hover:opacity-95 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap shadow-md"

                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>إضافة قسم</span>

            </div>
          </div>

          <!-- Existing Categories Pills -->
          <div id="merchant-category-pills" class="flex flex-wrap items-center gap-2">
            <!-- Rendered below -->
          </div>
        </div>

        <!-- Products Action Bar -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-white">قائمة المنتجات والمخزون</h2>

            <i data-lucide="plus" class="w-5 h-5"></i>
            <span>إضافة منتج جديد</span>
          </button>

        <!-- Products Grid (2 columns on mobile) -->
        <div id="merchant-products-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-6">
          <div class="col-span-full py-12 text-center text-gray-500">جاري تحميل المنتجات...</div>
        </div>
      </div>
    `;

    // Render Category Pills
    function renderCategoryPills() {
      const pillsContainer = document.getElementById('merchant-category-pills');
      pillsContainer.innerHTML = store.categories.map(cat => {
        const isDefault = cat === 'عام';
        return `
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-gray-200">
            <span>${cat}</span>
            ${!isDefault ? `
              <button data-cat="${cat}" class="btn-delete-cat text-gray-500 hover:text-rose-400 transition" title="حذف القسم">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            ` : ''}
          </span>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      pillsContainer.querySelectorAll('.btn-delete-cat').forEach(btn => {
        btn.onclick = async () => {
          const catToDelete = btn.dataset.cat;
          const updatedCats = store.categories.filter(c => c !== catToDelete);
          store.categories = await updateStoreCategories(store.id, updatedCats);
          renderCategoryPills();
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تم حذف القسم', timer: 1200, showConfirmButton: false });
        };
      });
    }

    renderCategoryPills();

    // Add Category Button
    const newCatInput = document.getElementById('new-category-input');
    const btnAddCat = document.getElementById('btn-add-category');

    async function handleAddCategory() {
      const catName = newCatInput.value.trim();
      if (!catName) return;
      if (store.categories.includes(catName)) {
        Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: 'هذا القسم موجود بالفعل', timer: 1500, showConfirmButton: false });
        return;
      }
      store.categories.push(catName);
      store.categories = await updateStoreCategories(store.id, store.categories);
      newCatInput.value = '';
      renderCategoryPills();
      Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تمت إضافة القسم بنجاح!', timer: 1500, showConfirmButton: false });
    }

    btnAddCat.onclick = handleAddCategory;
    newCatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddCategory();
      }

    const products = await getStoreProducts(store.id);

                <span class="absolute top-1.5 right-1.5 sm:top-3 sm:right-3 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-bold ${isOutOfStock ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'}">
                  ${isOutOfStock ? 'نفذت ❌' : `متوفر: ${prod.quantity}`}
                </span>
                
                ${hasDiscount ? `
                  <span class="absolute top-1.5 left-1.5 sm:top-3 sm:left-3 px-2 py-0.5 rounded-lg text-[9px] sm:text-xs font-black bg-rose-600 text-white shadow-md animate-pulse">
                    -${prod.discountPercent}% 🔥
                  </span>
                ` : `
                  <span class="absolute top-1.5 left-1.5 sm:top-3 sm:left-3 px-2 py-0.5 rounded-lg text-[9px] sm:text-[10px] font-bold bg-slate-900/90 text-cyan-400 border border-cyan-500/30">
                    ${prod.category || 'عام'}
                  </span>
                `}

                <div class="absolute bottom-1.5 left-1.5 sm:bottom-3 sm:left-3 px-2 sm:px-3 py-0.5 sm:py-1 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-bold bg-slate-900/90 text-cyan-300 font-code flex items-center gap-1 border border-cyan-500/30">
                  ${oldPrice ? `<span class="line-through text-gray-400 text-[9px] sm:text-[11px]">${oldPrice}</span>` : ''}
                  <span>${prod.price} ${store.currency || 'ج.م'}</span>
                </div>

              <div class="p-2.5 sm:p-4 text-right space-y-1 sm:space-y-2">

              <span class="text-[10px] sm:text-[11px] text-gray-500 font-code">#${prod.id.slice(-6)}</span>
              <div class="flex items-center gap-1 sm:gap-1.5">
                <button data-id="${prod.id}" class="btn-edit-product p-1.5 sm:p-2 hover:bg-cyan-500/20 rounded-xl text-cyan-400 transition cursor-pointer" title="تعديل المنتج">

                </button>
                <button data-id="${prod.id}" class="btn-delete-product p-1.5 sm:p-2 hover:bg-rose-500/20 rounded-xl text-rose-400 transition cursor-pointer" title="حذف">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      grid.querySelectorAll('.btn-edit-product').forEach(btn => {
        btn.onclick = () => {
          const prodId = btn.dataset.id;
          const target = products.find(p => p.id === prodId);
          if (target) {
            openProductModal(store, target, () => renderProductsTab(contentDiv, store));
          }
        };
      });

      grid.querySelectorAll('.btn-delete-product').forEach(btn => {
        btn.onclick = async () => {
          const prodId = btn.dataset.id;
          const confirm = await Swal.fire({ title: 'حذف المنتج؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم' });
          if (confirm.isConfirmed) {
            await deleteProduct(prodId);
            const idx = products.findIndex(p => p.id === prodId);
            if (idx >= 0) products.splice(idx, 1);
            renderGrid();
          }
        };
      });
    }

    renderGrid();

    document.getElementById('btn-open-add-product').onclick = () => {
      openProductModal(store, null, () => renderProductsTab(contentDiv, store));
    };
  }

    const modalEl = document.getElementById('preset-image-picker-modal');
    document.getElementById('btn-close-presets-modal').onclick = () => modalEl.remove();

    const grid = document.getElementById('preset-images-grid');
    const tabsContainer = document.getElementById('preset-cat-tabs');
    const refreshBtn = document.getElementById('btn-refresh-presets-modal');

    function bindCatTabs() {
      modalEl.querySelectorAll('.preset-cat-pill').forEach(btn => {

            b.className = 'preset-cat-pill px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-900 border border-slate-800 text-gray-300 hover:text-white transition';

      refreshBtn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i><span>جاري التحميل...</span>`;
      if (window.lucide) window.lucide.createIcons();
      presets = await getPresetImages();
      categories = buildCategories(presets);
      tabsContainer.innerHTML = `
        <button class="preset-cat-pill px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 transition" data-cat="all">🌟 الكل (${presets.length})</button>

    };

    function renderGrid() {
      const filtered = currentCategory === 'all'

      if (window.lucide) window.lucide.createIcons();

      grid.querySelectorAll('.preset-card').forEach(card => {
        card.onclick = () => {
          const target = presets.find(p => p.id === card.dataset.id);
          if (target) {
            onSelect(target);
            modalEl.remove();
          }
        };
      });
    }

    renderGrid();
    bindCatTabs();
  }

            box.className = 'rating-box flex flex-col items-center justify-center p-2 rounded-xl border border-orange-500 bg-orange-500/20 text-center shadow-lg shadow-orange-500/20';

      });
    }
    updateRatingUi(selectedRating);

      box.onclick = () => updateRatingUi(box.dataset.val);
    });

    closeBtn.onclick = () => modalEl.remove();

    btnUpload.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const saveBtn = document.getElementById('btn-save-prod');
      btnUpload.disabled = true;
      if (saveBtn) saveBtn.disabled = true;

      uploadStatus.innerHTML = `<span class="text-cyan-400 font-semibold animate-pulse">جاري رفع ومعالجة الصورة سحابياً...</span>`;
      const tempPreview = URL.createObjectURL(file);
      previewBox.innerHTML = `<img src="${tempPreview}" class="w-full h-full object-cover aspect-square" />`;

      try {
        const cloudUrl = await uploadImageToCatbox(file, (msg) => {
          uploadStatus.innerHTML = `<span class="text-cyan-400 text-xs">${msg}</span>`;
        });
        if (cloudUrl) {
          uploadedUrl = cloudUrl;
          previewBox.innerHTML = `<img src="${cloudUrl}" class="w-full h-full object-cover aspect-square" />`;
          uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم الرفع السحابي بنجاح! ✓</span>`;
        }
      } catch (err) {
        const fallbackData = await fileToDataUrl(file);
        uploadedUrl = fallbackData;
        previewBox.innerHTML = `<img src="${fallbackData}" class="w-full h-full object-cover aspect-square" />`;
        uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم حفظ الصورة بنجاح!</span>`;
      } finally {
        btnUpload.disabled = false;
        if (saveBtn) saveBtn.disabled = false;
      }
    };

    // Discount / Offer Calculation Listeners
    const discountCheck = document.getElementById('modal-prod-has-discount');
    const discountFields = document.getElementById('modal-discount-fields');
    const discountPercentInput = document.getElementById('modal-prod-discount-percent');
    const originalPriceInput = document.getElementById('modal-prod-original-price');
    const priceInput = document.getElementById('modal-prod-price');
    const discountCalcText = document.getElementById('discount-calc-text');

    function updateDiscountCalc() {
      if (!discountCheck || !discountCheck.checked) return;
      const pct = parseInt(discountPercentInput?.value, 10) || 0;
      const currentP = parseFloat(priceInput?.value) || 0;
      let origP = parseFloat(originalPriceInput?.value) || 0;

      if (pct > 0 && currentP > 0) {
        if (!origP || origP <= currentP) {
          origP = Math.round(currentP / (1 - (pct / 100)));
          if (originalPriceInput) originalPriceInput.value = origP;
        }
        const saved = origP - currentP;
        if (discountCalcText) {
          discountCalcText.innerHTML = `قبل الخصم: <span class="line-through text-gray-400">${origP}</span> • بعد الخصم: <span class="text-emerald-400 font-bold">${currentP} ${store.currency || 'ج.م'}</span> (وفرت ${saved} ${store.currency || 'ج.م'}) 🔥`;
        }
      }
    }

    if (discountCheck && discountFields) {
      discountCheck.onchange = () => {
        if (discountCheck.checked) {
          discountFields.classList.remove('hidden');
          updateDiscountCalc();
        } else {
          discountFields.classList.add('hidden');
        }
      };
    }

    if (discountPercentInput) {
      discountPercentInput.oninput = () => {
        const pct = parseInt(discountPercentInput.value, 10) || 0;
        const currentP = parseFloat(priceInput?.value) || 0;
        if (pct > 0 && currentP > 0) {
          const origP = Math.round(currentP / (1 - (pct / 100)));
          if (originalPriceInput) originalPriceInput.value = origP;
          updateDiscountCalc();
        }
      };
    }

    if (originalPriceInput) {
      originalPriceInput.oninput = () => {
        const origP = parseFloat(originalPriceInput.value) || 0;
        const currentP = parseFloat(priceInput?.value) || 0;
        if (origP > currentP && currentP > 0) {
          const pct = Math.round(((origP - currentP) / origP) * 100);
          if (discountPercentInput) discountPercentInput.value = pct;
          updateDiscountCalc();
        }
      };
    }

    if (priceInput) priceInput.oninput = () => updateDiscountCalc();
    if (existingProd && existingProd.discountPercent > 0) updateDiscountCalc();

    form.onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('modal-prod-title').value;
      const price = document.getElementById('modal-prod-price').value;
      const quantity = document.getElementById('modal-prod-qty').value;
      const category = document.getElementById('modal-prod-category').value;
      const description = document.getElementById('modal-prod-desc').value;

      const hasDiscount = document.getElementById('modal-prod-has-discount')?.checked || false;
      const discountPercent = hasDiscount ? (parseInt(document.getElementById('modal-prod-discount-percent')?.value, 10) || 0) : 0;
      let originalPrice = hasDiscount ? (parseFloat(document.getElementById('modal-prod-original-price')?.value) || null) : null;
      if (hasDiscount && discountPercent > 0 && (!originalPrice || originalPrice <= parseFloat(price))) {
        originalPrice = Math.round(parseFloat(price) / (1 - (discountPercent / 100)));
      }

      const saveBtn = document.getElementById('btn-save-prod');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>جاري الحفظ...</span>`;

      try {
        if (existingProd) {
          await updateProduct(existingProd.id, {
            title,
            price: parseFloat(price),
            quantity: parseInt(quantity, 10),
            category,
            rating: selectedRating,
            discountPercent,
            originalPrice,
            description,
            imageUrl: uploadedUrl || existingProd.imageUrl
          });
        } else {
          await addProduct(store.id, {
            title,
            price,
            quantity,
            category,
            rating: selectedRating,
            discountPercent,
            originalPrice,
            description,
            imageUrl: uploadedUrl || DEFAULT_PRODUCT_IMG
          });
        }

        modalEl.remove();
        onSuccess();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تم حفظ المنتج بنجاح!', timer: 1500, showConfirmButton: false });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span>حفظ المنتج</span>`;
      }
    };
  }

                    <span>رفع صورة</span>
                  </button>
                  <button type="button" class="btn-req-wallet px-2.5 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 rounded-xl text-[11px] font-bold border border-cyan-500/30 flex items-center gap-1 transition" data-index="${index}">
                    <i data-lucide="wallet" class="w-3 h-3"></i>
                    <span>المحفظة ✨</span>
                  </button>
                  ${imgVal ? `
                    <button type="button" class="btn-req-clear-img p-1.5 text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="حذف صورة هذا المطلوب" data-index="${index}">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
              <span class="text-[10px] text-gray-500 hidden sm:inline">
                ${imgVal ? '<span class="text-emerald-400 font-bold">✓ صورة مضافة</span>' : 'صورة المطلوب (اختياري)'}
              </span>
            </div>
          </div>
        `;
      }).join('');
      if (window.lucide) window.lucide.createIcons();

      reqContainer.querySelectorAll('.trade-req-text').forEach((inp, idx) => {
        inp.oninput = (e) => {
          if (typeof requirements[idx] === 'string') requirements[idx] = { text: e.target.value, image: '' };
          else requirements[idx].text = e.target.value;
        };
      });

      reqContainer.querySelectorAll('.btn-remove-req').forEach(btn => {
        btn.onclick = () => {
          if (requirements.length <= 1) return;
          const idx = parseInt(btn.dataset.index, 10);
          requirements.splice(idx, 1);
          renderRequirementRows();
        };
      });

      reqContainer.querySelectorAll('.btn-req-upload').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          const input = reqContainer.querySelector(`.req-file-input[data-index="${idx}"]`);
          if (input) input.click();
        };
      });

      reqContainer.querySelectorAll('.req-file-input').forEach(input => {
        input.onchange = async () => {
          const idx = parseInt(input.dataset.index, 10);
          const file = input.files[0];
          if (!file) return;

          const previewEl = reqContainer.querySelector(`.req-img-preview[data-index="${idx}"]`);
          if (previewEl) {
            previewEl.innerHTML = `<span class="animate-spin text-cyan-400 text-xs">⏳</span>`;
          }

          try {
            const cloudUrl = await uploadImageToCatbox(file);
            const finalImg = cloudUrl || await fileToDataUrl(file);
            if (typeof requirements[idx] === 'string') requirements[idx] = { text: requirements[idx], image: finalImg };
            else requirements[idx].image = finalImg;
          } catch (err) {
            const fallbackData = await fileToDataUrl(file);
            if (typeof requirements[idx] === 'string') requirements[idx] = { text: requirements[idx], image: fallbackData };
            else requirements[idx].image = fallbackData;
          }
          renderRequirementRows();
        };
      });

      reqContainer.querySelectorAll('.btn-req-wallet').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          openPresetImagePickerModal((preset) => {
            if (typeof requirements[idx] === 'string') requirements[idx] = { text: requirements[idx], image: preset.imageUrl };
            else requirements[idx].image = preset.imageUrl;
            renderRequirementRows();
          });
        };
      });

      reqContainer.querySelectorAll('.btn-req-clear-img').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (typeof requirements[idx] === 'string') requirements[idx] = { text: requirements[idx], image: '' };
          else requirements[idx].image = '';
          renderRequirementRows();
        };
      });
    }

    renderRequirementRows();

    btnAddReq.onclick = () => {
      requirements.push({ text: '', image: '' });
      renderRequirementRows();
      const inputs = reqContainer.querySelectorAll('.trade-req-text');
      if (inputs.length) inputs[inputs.length - 1].focus();
    };

    // Preset Wallet Integration for Trade Offer Image
    const btnPresets = document.getElementById('btn-open-trade-presets');
    const previewBox = document.getElementById('trade-preview-box');
    const uploadStatus = document.getElementById('trade-upload-status');

    btnPresets.onclick = () => {
      openPresetImagePickerModal((preset) => {
        uploadedUrl = preset.imageUrl;
        previewBox.innerHTML = `<img src="${preset.imageUrl}" class="w-full h-full object-cover aspect-square" />`;
        uploadStatus.innerHTML = `<span class="text-amber-400 font-bold">تم اختيار صورة (${preset.title}) من المحفظة! ✨</span>`;
      });
    };

    // File upload for Trade Offer Image
    const fileInput = document.getElementById('trade-file-input');
    const btnUpload = document.getElementById('btn-upload-trade-file');
    btnUpload.onclick = () => fileInput.click();

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const saveBtn = document.getElementById('btn-save-trade');
      btnUpload.disabled = true;
      if (saveBtn) saveBtn.disabled = true;

      uploadStatus.innerHTML = `<span class="text-cyan-400 font-semibold animate-pulse">جاري رفع ومعالجة الصورة سحابياً...</span>`;
      const tempPreview = URL.createObjectURL(file);
      previewBox.innerHTML = `<img src="${tempPreview}" class="w-full h-full object-cover aspect-square" />`;

      try {
        const cloudUrl = await uploadImageToCatbox(file, (msg) => {
          uploadStatus.innerHTML = `<span class="text-cyan-400 text-xs">${msg}</span>`;
        });
        if (cloudUrl) {
          uploadedUrl = cloudUrl;
          previewBox.innerHTML = `<img src="${cloudUrl}" class="w-full h-full object-cover aspect-square" />`;
          uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم الرفع السحابي بنجاح! ✓</span>`;
        }
      } catch (err) {
        const fallbackData = await fileToDataUrl(file);
        uploadedUrl = fallbackData;
        previewBox.innerHTML = `<img src="${fallbackData}" class="w-full h-full object-cover aspect-square" />`;
        uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم حفظ الصورة بنجاح!</span>`;
      } finally {
        btnUpload.disabled = false;
        if (saveBtn) saveBtn.disabled = false;
      }
    };

    // Submit Trade Offer
    const form = document.getElementById('trade-modal-form');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const offeredTitle = document.getElementById('trade-offered-title').value.trim();
      const offeredDescription = document.getElementById('trade-offered-desc').value.trim();
      const cleanReqs = requirements
        .map(r => typeof r === 'string' ? { text: r.trim(), image: '' } : { text: (r.text || '').trim(), image: (r.image || '').trim() })
        .filter(r => r.text.length > 0);

      if (!offeredTitle) {
        Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى كتابة اسم المعروض للبدل' });
        return;
      }
      if (!cleanReqs.length) {
        Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى كتابة متطلب واحد على الأقل في المطلوب في المقابل' });
        return;
      }

      const saveBtn = document.getElementById('btn-save-trade');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>جاري الحفظ...</span>`;

      try {
        if (existingTrade) {
          await updateTrade(existingTrade.id, {
            offeredTitle,
            offeredDescription,
            offeredImage: uploadedUrl || window.DEFAULT_PRODUCT_IMG,
            requiredItems: cleanReqs
          });
        } else {
          await createTrade({
            storeId: store.id,
            offeredTitle,
            offeredDescription,
            offeredImage: uploadedUrl || window.DEFAULT_PRODUCT_IMG,
            requiredItems: cleanReqs,
            status: 'available'
          });
        }

        modalEl.remove();
        Swal.fire({
          icon: 'success',
          title: existingTrade ? 'تم تحديث عرض التبديل!' : 'تم نشر عرض التبديل بنجاح!',
          timer: 1500,
          showConfirmButton: false
        });
        onSuccess();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span>حفظ عرض التبديل</span>`;
        Swal.fire({ icon: 'error', title: 'خطأ', text: err.message || 'حدث خطأ أثناء الحفظ' });
      }
    };
  }

          const confirm = await Swal.fire({

            text: 'سيتم تحويل حالة الطلب لمكتمل وخصم الكمية تلقائياً من المخزون.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'نعم، إتمام وخصم'
          });

          if (confirm.isConfirmed) {
            btn.disabled = true;
            btn.innerHTML = `<span>جاري الإتمام...</span>`;
            try {
              const res = await completeDeal(orderId, store.id);
              if (window.confetti) window.confetti({ particleCount: 70, spread: 70 });
              const ord = orders.find(o => o.id === orderId);
              if (ord) ord.status = 'completed';
              Swal.fire({ icon: 'success', title: 'تمت الصفقة بنجاح!', text: `تم خصم ${res.deducted} قطعة، المتبقي: ${res.newQuantity}` });
              renderOrders();
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
            }
          }
        };
      });
    }

    renderOrders();
  }

  function promptRenewalModal(store, onRenewed = () => {}) {
    Swal.fire({

      html: `

        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'تأكيد التمديد',

        const code = document.getElementById('swal-renew-input').value.trim();
        if (!code) {
          Swal.showValidationMessage('يرجى كتابة كود الاشتراك');
          return false;
        }
