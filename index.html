                <i data-lucide="send" class="w-4 h-4"></i>
                <span>تليجرام المتجر</span>
              </a>
            ` : ''}
          </div>
        </div>

        <!-- Store Navigation Tabs (المنتجات للبيع vs قسم التبديل والمقايضة) -->
        <div class="flex items-center gap-3 border-b border-slate-800/80 pb-3" id="storefront-main-tabs">
          <button id="storefront-tab-prods" class="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-gradient-to-r ${curTheme.btn} text-white shadow-lg ${curTheme.shadow}">
            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
            <span>قائمة المنتجات (${products.length})</span>
          </button>
          <button id="storefront-tab-trades" class="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-amber-400 hover:text-amber-300 hover:border-amber-500/40">
            <i data-lucide="repeat" class="w-4 h-4"></i>
            <span>قسم التبديل والمقايضة (${trades.length})</span>
            ${trades.length > 0 ? `<span class="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30">متاح</span>` : ''}
          </button>
        </div>

        <!-- Products Section -->
        <div id="storefront-products-section" class="space-y-6">
          <!-- Special Offers Instagram-Style Carousel Banner -->
          <div id="storefront-offers-carousel"></div>

          <!-- Category Filter Bar -->
          <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="storefront-category-pills">
            <button class="storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-600 text-white shadow-md shadow-cyan-600/20 whitespace-nowrap transition" data-cat="all">
              🌟 جميع الأقسام (${products.length})
            </button>
            ${store.categories.map(c => {
              const catCount = products.filter(p => (p.category || 'عام') === c).length;
              return `
                <button class="storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-gray-300 hover:text-white border border-slate-800 whitespace-nowrap transition" data-cat="${c}">
                  ${c} (${catCount})
                </button>
              `;
            }).join('')}
          </div>

          <!-- Products Grid (2 products side-by-side on mobile!) -->
          <div id="storefront-products-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
            <!-- Rendered below -->
          </div>
        </div>

        <!-- Trades / Exchange Section -->
        <div id="storefront-trades-section" class="hidden space-y-6">
          <div class="p-4 bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-transparent rounded-2xl border border-amber-500/30 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0">
              <i data-lucide="repeat" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white">قسم عروض التبديل (المقايضة) 🔄</h3>
              <p class="text-xs text-gray-300">اختر أي قطعة من المعروضات لمعاينة ما يطلبه التاجر في المقابل وإتمام التبديل معه فوراً!</p>
            </div>
          </div>

          <!-- Trades Grid -->
          <div id="storefront-trades-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Rendered below -->
          </div>
        </div>

      </div>

      <!-- Floating Bottom Cart Bar -->
      <div id="storefront-cart-bar" class="fixed bottom-4 left-4 right-4 max-w-2xl mx-auto z-40 hidden transition-all duration-300">
        <div class="glass-panel p-4 rounded-2xl border-2 border-cyan-500/50 shadow-2xl shadow-cyan-500/20 flex flex-col sm:flex-row items-center justify-between gap-4 backdrop-blur-xl bg-slate-950/95">
          <div class="flex items-center gap-3">
            <div class="relative w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
              <i data-lucide="shopping-bag" class="w-6 h-6"></i>
              <span id="cart-badge-count" class="absolute -top-1.5 -right-1.5 px-2 py-0.5 rounded-full text-[11px] font-black bg-rose-500 text-white border-2 border-slate-950">0</span>
            </div>
            <div class="text-right">
              <div class="text-xs text-gray-400 font-bold">سلة المشتريات</div>
              <div class="text-white font-black text-sm sm:text-base flex items-center gap-2">
                <span id="cart-bar-items-count">0 منتجات</span>
                <span class="text-slate-600">•</span>
                <span id="cart-bar-total-price" class="text-cyan-400 font-code font-black">0 ${store.currency || 'ج.م'}</span>
              </div>
            </div>
          </div>
          <button id="btn-open-cart-checkout" class="w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:opacity-95 text-white font-black text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
            <span>عرض السلة وإتمام الطلب</span>
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    `;

    if (window.lucide) window.lucide.createIcons();

    const grid = document.getElementById('storefront-products-grid');
    const catButtons = container.querySelectorAll('.storefront-cat-btn');

    function renderStoreGrid() {
      const filtered = selectedCategory === 'all' 
        ? products 
        : products.filter(p => (p.category || 'عام') === selectedCategory);

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 glass-panel rounded-3xl">
            <i data-lucide="package-search" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
            <p class="text-base font-bold text-gray-400">لا توجد منتجات في هذا القسم حالياً</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(prod => {
        const isOutOfStock = prod.quantity <= 0;
        const hasDiscount = (parseInt(prod.discountPercent, 10) || 0) > 0;
        const oldPrice = prod.originalPrice ? parseFloat(prod.originalPrice) : (hasDiscount ? Math.round(prod.price / (1 - (prod.discountPercent / 100))) : null);

        return `
          <div class="glass-card rounded-2xl sm:rounded-3xl overflow-hidden flex flex-col justify-between border border-slate-800 shadow-xl group hover:border-cyan-500/30 transition">
            <div>
              <div class="relative aspect-square bg-slate-950 overflow-hidden">
                <img src="${prod.imageUrl || window.DEFAULT_PRODUCT_IMG}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src=window.DEFAULT_PRODUCT_IMG;" />
                
                <span class="absolute top-1.5 right-1.5 sm:top-3 sm:right-3 px-2 sm:px-3 py-0.5 sm:py-1 rounded-lg sm:rounded-xl text-[9px] sm:text-xs font-bold ${isOutOfStock ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'} shadow-lg backdrop-blur-md">
                  ${isOutOfStock ? 'نفذت ❌' : `متوفر: ${prod.quantity}`}
                </span>

                ${hasDiscount ? `
                  <span class="absolute top-1.5 left-1.5 sm:top-3 sm:left-3 px-2 sm:px-2.5 py-0.5 rounded-lg text-[10px] sm:text-xs font-black bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-lg animate-pulse">
                    -${prod.discountPercent}% 🔥
                  </span>
                ` : `
                  <span class="absolute top-1.5 left-1.5 sm:top-3 sm:left-3 px-1.5 sm:px-2.5 py-0.5 rounded-lg text-[9px] sm:text-xs font-bold bg-slate-900/90 text-cyan-400 border border-cyan-500/30 backdrop-blur-md">
                    ${prod.category || 'عام'}
                  </span>
                `}

                <div class="absolute bottom-1.5 left-1.5 sm:bottom-3 sm:left-3 px-2 sm:px-3 py-0.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-black bg-slate-950/90 text-cyan-300 font-code border border-cyan-500/30 flex items-center gap-1 backdrop-blur-md">
                  ${oldPrice ? `<span class="text-[10px] sm:text-xs text-gray-400 line-through mr-0.5">${oldPrice}</span>` : ''}
                  <span>${prod.price} ${store.currency || 'ج.م'}</span>
                </div>
              </div>

              <div class="p-2.5 sm:p-5 text-right space-y-1 sm:space-y-2">
                <div class="flex items-center justify-between gap-1.5">
                  <h3 class="font-extrabold text-white text-xs sm:text-lg group-hover:text-cyan-300 transition truncate">${prod.title}</h3>
                  <div class="flex-shrink-0 scale-85 sm:scale-100 origin-left">
                    ${renderRatingHtml(prod.rating)}
                  </div>
                </div>
                <p class="text-[11px] sm:text-xs text-gray-300 line-clamp-2 leading-relaxed hidden sm:block">${prod.description || 'شحن وتسليم فوري ومباشر.'}</p>
              </div>
            </div>

            <div class="p-2.5 sm:p-5 pt-0">
              ${isOutOfStock ? `
                <button disabled class="w-full py-2 sm:py-3.5 bg-slate-800 text-gray-500 font-bold rounded-xl text-xs sm:text-sm cursor-not-allowed">نفذت الكمية</button>
              ` : `
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <div class="flex items-center bg-slate-900/90 border border-slate-700 rounded-xl overflow-hidden px-0.5 sm:px-1 py-0.5">
                    <button type="button" class="btn-qty-minus px-1.5 sm:px-2.5 py-1 sm:py-2 text-gray-300 hover:text-white font-black text-xs sm:text-sm" data-prod-id="${prod.id}">-</button>
                    <input type="number" id="input-qty-${prod.id}" value="1" min="1" max="${prod.quantity}" class="w-6 sm:w-10 text-center bg-transparent text-white font-code font-bold text-xs sm:text-sm focus:outline-none" />
                    <button type="button" class="btn-qty-plus px-1.5 sm:px-2.5 py-1 sm:py-2 text-gray-300 hover:text-white font-black text-xs sm:text-sm" data-prod-id="${prod.id}">+</button>
                  </div>
                  <button data-prod-id="${prod.id}" class="btn-add-to-cart flex-1 py-2 sm:py-3 bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-600 hover:opacity-95 text-white font-extrabold rounded-xl text-[11px] sm:text-sm shadow-md sm:shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-1 sm:gap-2 cursor-pointer">
                    <i data-lucide="shopping-cart" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span>أضف للسلة</span>
                  </button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      // Quantity Steppers
      grid.querySelectorAll('.btn-qty-minus').forEach(btn => {
        btn.onclick = () => {
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          if (input) {
            let val = parseInt(input.value, 10) || 1;
            if (val > 1) input.value = val - 1;
          }
        };
      });

      grid.querySelectorAll('.btn-qty-plus').forEach(btn => {
        btn.onclick = () => {
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          const prod = products.find(p => p.id === btn.dataset.prodId);
          if (input && prod) {
            let val = parseInt(input.value, 10) || 1;
            if (val < prod.quantity) input.value = val + 1;
          }
        };
      });

      // Add To Cart Button
      grid.querySelectorAll('.btn-add-to-cart').forEach(btn => {
        btn.onclick = () => {
          const prod = products.find(p => p.id === btn.dataset.prodId);
          const input = document.getElementById(`input-qty-${btn.dataset.prodId}`);
          const qty = input ? (parseInt(input.value, 10) || 1) : 1;
          if (prod) addToCart(prod, qty);
        };
      });
    }

    // =========================================================================
    // Instagram Stories-Style Auto-Rotating Offers Carousel (Every 4 Seconds)
    // =========================================================================
    function initOffersCarousel() {
      const carouselContainer = document.getElementById('storefront-offers-carousel');
      if (!carouselContainer) return;

      const offerProds = products.filter(p => (parseInt(p.discountPercent, 10) || 0) > 0 && (parseInt(p.quantity, 10) || 0) > 0);
      if (!offerProds.length) {
        carouselContainer.innerHTML = '';
        return;
      }

      let currentOfferIndex = 0;
      if (window._offerSlideInterval) clearInterval(window._offerSlideInterval);

      function renderStory() {
        const cur = offerProds[currentOfferIndex];
        const oldPrice = cur.originalPrice ? parseFloat(cur.originalPrice) : Math.round(cur.price / (1 - (cur.discountPercent / 100)));
        const savedAmount = Math.max(0, oldPrice - cur.price);

        carouselContainer.innerHTML = `
          <div class="relative rounded-3xl p-[1px] bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 shadow-2xl shadow-rose-500/10 mb-8 overflow-hidden group">
            <div class="bg-gradient-to-b from-slate-900/98 via-slate-950/98 to-slate-950 rounded-[23px] p-4 sm:p-6 text-right relative overflow-hidden backdrop-blur-xl">
              
              <!-- Subtle decorative background light -->
              <div class="absolute -top-16 -left-16 w-48 h-48 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>
              <div class="absolute -bottom-16 -right-16 w-48 h-48 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

              <!-- Instagram Story Progress Bars -->
              <div class="flex items-center gap-1.5 mb-4">
                ${offerProds.map((_, idx) => `
                  <div class="h-1 sm:h-1.5 flex-1 bg-white/20 rounded-full overflow-hidden relative">
                    <div id="story-bar-${idx}" class="h-full bg-gradient-to-r from-pink-400 to-amber-300 rounded-full ${idx < currentOfferIndex ? 'w-full' : (idx === currentOfferIndex ? 'w-0' : 'w-0')}"></div>
                  </div>
                `).join('')}
              </div>

              <!-- Story Header -->
              <div class="flex items-center justify-between gap-3 pb-3 border-b border-slate-800/60 mb-4">
                <div class="flex items-center gap-2.5">
                  <div class="p-0.5 rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-pink-600 shadow-md">
                    <img src="${store.logoUrl || window.DEFAULT_STORE_LOGO}" class="w-8 h-8 rounded-full object-cover border-2 border-slate-950" onerror="this.onerror=null; this.src=window.DEFAULT_STORE_LOGO;" />
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-black text-white text-xs sm:text-sm">${store.name}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded-md bg-rose-500/20 text-rose-300 font-bold border border-rose-500/30">عرض خاص 🔥</span>
                    </div>
                    <span class="text-[10px] text-gray-400 font-medium">يتغير تلقائياً كل 4 ثوانٍ ⏱️</span>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <span class="text-[11px] font-bold text-gray-300 bg-slate-800/80 px-2.5 py-1 rounded-xl font-code">
                    ${currentOfferIndex + 1} / ${offerProds.length}
                  </span>
                  <button id="btn-story-prev" class="w-7 h-7 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-gray-300 hover:text-white flex items-center justify-center transition">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                  <button id="btn-story-next" class="w-7 h-7 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-gray-300 hover:text-white flex items-center justify-center transition">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Story Card Content -->
              <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-center">
                
                <!-- Product Image Banner -->
                <div class="sm:col-span-5 relative aspect-video sm:aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-lg">
                  <img src="${cur.imageUrl || window.DEFAULT_PRODUCT_IMG}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" onerror="this.onerror=null; this.src=window.DEFAULT_PRODUCT_IMG;" />
                  <span class="absolute top-2.5 right-2.5 px-3 py-1 rounded-xl text-xs font-black bg-gradient-to-r from-rose-600 via-pink-600 to-amber-500 text-white shadow-xl animate-pulse">
                    خصم ${cur.discountPercent}% 🔥
                  </span>
                  <span class="absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-xl text-[10px] font-bold bg-slate-900/90 text-cyan-300 border border-cyan-500/30 backdrop-blur-md">
                    المتبقي: ${cur.quantity} قطع فقط
                  </span>
                </div>

                <!-- Product Details & Pricing -->
                <div class="sm:col-span-7 space-y-3">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-bold bg-slate-800 text-cyan-400 border border-cyan-500/20">${cur.category || 'عام'}</span>
                    ${renderRatingHtml(cur.rating)}
                  </div>
                  
                  <h3 class="text-base sm:text-xl font-black text-white leading-snug line-clamp-2">${cur.title}</h3>
                  <p class="text-xs text-gray-300 line-clamp-2">${cur.description || 'فرصة حصرية لفترة محدودة، سارع بالطلب الآن قبل نفاد الكمية المعروضة!'}</p>

                  <!-- Price Calculation Showcase -->
                  <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5">
                      <div>
                        <div class="text-[10px] text-gray-400 font-bold">السعر قبل الخصم</div>
                        <div class="text-xs sm:text-sm text-gray-400 line-through font-code font-bold">${oldPrice} ${store.currency || 'ج.م'}</div>
                      </div>
                      <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-rose-400"></i>
                      <div>
                        <div class="text-[10px] text-rose-300 font-bold">السعر بعد الخصم</div>
                        <div class="text-base sm:text-xl font-black text-rose-400 font-code">${cur.price} ${store.currency || 'ج.م'}</div>
                      </div>
                    </div>
                    ${savedAmount > 0 ? `
                      <span class="px-2.5 py-1 rounded-xl text-[11px] font-black bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-3 h-3 text-emerald-400"></i>
                        <span>وفرت ${savedAmount} ${store.currency || 'ج.م'}</span>
                      </span>
                    ` : ''}
                  </div>

                  <!-- Direct Add Offer Button -->
                  <div class="pt-1 flex items-center gap-2">
                    <button id="btn-add-story-offer" class="flex-1 py-3 px-4 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 hover:opacity-95 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-rose-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                      <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                      <span>اطلب العرض مع الخصم فوراً 🛒</span>
                    </button>
                  </div>
                </div>

              </div>

            </div>
          </div>
        `;

        if (window.lucide) window.lucide.createIcons();

        // Animate the active story bar over 4 seconds
        setTimeout(() => {
          const activeBar = document.getElementById(`story-bar-${currentOfferIndex}`);
          if (activeBar) {
            activeBar.style.transition = 'width 4000ms linear';
            activeBar.style.width = '100%';
          }
        }, 30);

        // Story Controls
        const prevBtn = document.getElementById('btn-story-prev');
        const nextBtn = document.getElementById('btn-story-next');
        const addBtn = document.getElementById('btn-add-story-offer');

        if (prevBtn) {
          prevBtn.onclick = () => {
            currentOfferIndex = (currentOfferIndex - 1 + offerProds.length) % offerProds.length;
            renderStory();
            restartTimer();
          };
        }

        if (nextBtn) {
          nextBtn.onclick = () => {
            currentOfferIndex = (currentOfferIndex + 1) % offerProds.length;
            renderStory();
            restartTimer();
          };
        }

        if (addBtn) {
          addBtn.onclick = () => {
            addToCart(cur, 1);
            if (window.confetti) window.confetti({ particleCount: 50 });
          };
        }
      }

      function restartTimer() {
        if (window._offerSlideInterval) clearInterval(window._offerSlideInterval);
        window._offerSlideInterval = setInterval(() => {
          currentOfferIndex = (currentOfferIndex + 1) % offerProds.length;
          renderStory();
        }, 4000);
      }

      renderStory();
      restartTimer();
    }

    renderStoreGrid();
    initOffersCarousel();

    // Category button switching
    catButtons.forEach(btn => {
      btn.onclick = () => {
        catButtons.forEach(b => {
          b.className = 'storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-gray-300 hover:text-white border border-slate-800 whitespace-nowrap transition';
        });
        btn.className = 'storefront-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-600 text-white shadow-md shadow-cyan-600/20 whitespace-nowrap transition';
        selectedCategory = btn.dataset.cat;
        renderStoreGrid();
      };
    });

    // Section Switcher: Products vs Trades
    const prodsSection = document.getElementById('storefront-products-section');
    const tradesSection = document.getElementById('storefront-trades-section');
    const tabProdsBtn = document.getElementById('storefront-tab-prods');
    const tabTradesBtn = document.getElementById('storefront-tab-trades');

    function switchStorefrontTab(targetTab) {
      currentStorefrontTab = targetTab;
      if (targetTab === 'products') {
        prodsSection.classList.remove('hidden');
        tradesSection.classList.add('hidden');
        tabProdsBtn.className = `px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-gradient-to-r ${curTheme.btn} text-white shadow-lg ${curTheme.shadow}`;
        tabTradesBtn.className = 'px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-amber-400 hover:text-amber-300 hover:border-amber-500/40';
        updateCartBar();
      } else {
        prodsSection.classList.add('hidden');
        tradesSection.classList.remove('hidden');
        tabTradesBtn.className = 'px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black shadow-lg shadow-amber-500/20';
        tabProdsBtn.className = 'px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-gray-400 hover:text-white';
        const cartBar = document.getElementById('storefront-cart-bar');
        if (cartBar) cartBar.classList.add('hidden');
        renderStoreTradesGrid();
      }
    }

    if (tabProdsBtn) tabProdsBtn.onclick = () => switchStorefrontTab('products');
    if (tabTradesBtn) tabTradesBtn.onclick = () => switchStorefrontTab('trades');

    function renderStoreTradesGrid() {
      const tradesGrid = document.getElementById('storefront-trades-grid');
      if (!tradesGrid) return;

      if (!trades.length) {
        tradesGrid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 glass-panel rounded-3xl">
            <i data-lucide="repeat" class="w-12 h-12 mx-auto mb-3 opacity-30 text-amber-400"></i>
            <p class="text-base font-bold text-gray-300">لا توجد عروض تبديل معروضة حالياً في هذا المتجر</p>
            <p class="text-xs text-gray-500 mt-1">تابع المتجر للتعرف على أحدث عروض البدل فور توفرها</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      tradesGrid.innerHTML = trades.map(trade => {
        const isAvail = trade.status === 'available';
        const reqList = Array.isArray(trade.requiredItems) ? trade.requiredItems : [];
        return `
          <div class="storefront-trade-card glass-card rounded-3xl overflow-hidden border border-slate-800 hover:border-amber-500/40 transition duration-300 flex flex-col justify-between group cursor-pointer shadow-xl" data-id="${trade.id}">
            <div>
              <div class="aspect-square bg-slate-950 overflow-hidden relative">
                <img src="${trade.offeredImage || window.DEFAULT_PRODUCT_IMG}" class="w-full h-full object-cover aspect-square group-hover:scale-105 transition duration-300" onerror="this.onerror=null; this.src=window.DEFAULT_PRODUCT_IMG;" />
                <span class="absolute top-3 right-3 px-3 py-1 rounded-xl text-xs font-black shadow-lg ${isAvail ? 'bg-amber-500 text-slate-950 shadow-amber-500/30' : 'bg-slate-800 text-gray-400'}">
                  ${isAvail ? '🔄 متاح للتبديل' : '✓ تم التبديل'}
                </span>
                <span class="absolute bottom-3 left-3 px-2.5 py-1 rounded-xl text-[10px] font-bold bg-slate-950/80 text-cyan-300 border border-cyan-500/30 backdrop-blur-md">
                  ${reqList.length} متطلبات في المقابل
                </span>
              </div>
              <div class="p-5 space-y-3 text-right">
                <div>
                  <span class="text-[10px] font-bold text-amber-400">المعروض:</span>
                  <h3 class="text-base font-extrabold text-white group-hover:text-amber-400 transition truncate">${trade.offeredTitle}</h3>
                  ${trade.offeredDescription ? `<p class="text-xs text-gray-300 line-clamp-2 mt-1">${trade.offeredDescription}</p>` : ''}
                </div>

                <div class="p-3 bg-slate-900/90 rounded-2xl border border-slate-800/80 space-y-1.5">
                  <div class="text-[11px] font-bold text-cyan-400 flex items-center gap-1">
                    <i data-lucide="target" class="w-3.5 h-3.5"></i>
                    <span>المطلوب في المقابل:</span>
                  </div>
                  <div class="text-xs text-gray-200 line-clamp-2 font-medium">
                    ${reqList.map((r, i) => `${i + 1}. ${typeof r === 'string' ? r : (r.text || '')}`).join(' • ')}
                  </div>
                </div>
              </div>
            </div>

            <div class="p-5 pt-0">
              <button class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:opacity-95 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/20 transition flex items-center justify-center gap-2">
                <i data-lucide="eye" class="w-4 h-4"></i>
                <span>معاينة المطلوب والتفاصيل 🔍</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
      if (window.lucide) window.lucide.createIcons();

      tradesGrid.querySelectorAll('.storefront-trade-card').forEach(card => {
        card.onclick = () => {
          const target = trades.find(t => t.id === card.dataset.id);
          if (target) openCustomerTradeModal(store, target);
        };
      });
    }

    // Cart Button Trigger
    const btnOpenCart = document.getElementById('btn-open-cart-checkout');
    if (btnOpenCart) {
      btnOpenCart.onclick = () => openCartModal(store, cart, updateCartBar);
    }
  }

  function openCartModal(store, cart, onCartChange = () => {}) {
    // Remove any existing cart modal
    const oldModal = document.getElementById('customer-cart-modal');
    if (oldModal) oldModal.remove();

    function renderCartModalContent() {
      const modalBox = document.getElementById('customer-cart-modal-box');
      if (!modalBox) return;

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      if (cart.length === 0) {
        modalBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="shopping-cart" class="w-5 h-5 text-cyan-400"></i>
              <span>سلة المشتريات (${store.name})</span>
            </h3>
            <button id="btn-close-cart-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="py-12 text-center text-gray-400 space-y-3">
            <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto text-gray-600"></i>
            <p class="font-bold">سلة المشتريات فارغة حالياً</p>
            <button id="btn-close-empty-cart" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold">تصفح المنتجات</button>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        document.getElementById('btn-close-cart-modal')?.addEventListener('click', () => {
          document.getElementById('customer-cart-modal')?.remove();
        });
        document.getElementById('btn-close-empty-cart')?.addEventListener('click', () => {
          document.getElementById('customer-cart-modal')?.remove();
        });
        return;
      }

      modalBox.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <i data-lucide="shopping-cart" class="w-5 h-5 text-cyan-400"></i>
            <h3 class="text-base font-bold text-white">سلة المشتريات وإتمام الطلب</h3>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-cyan-500/20 text-cyan-300 font-code">${totalCount} قطع</span>
          </div>
          <button id="btn-close-cart-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <!-- Items List -->
        <div class="space-y-3 max-h-56 overflow-y-auto pr-1">
          ${cart.map((item, idx) => `
            <div class="p-3 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-3 min-w-0">
                <img src="${item.imageUrl || window.DEFAULT_PRODUCT_IMG}" class="w-12 h-12 rounded-xl object-cover border border-slate-700 bg-slate-950 flex-shrink-0" onerror="this.onerror=null; this.src=window.DEFAULT_PRODUCT_IMG;" />
                <div class="min-w-0">
                  <div class="font-bold text-white truncate">${item.title}</div>
                  <div class="text-[11px] text-gray-400 font-code mt-0.5">${item.price} ${store.currency || 'ج.م'} للقطعة</div>
                </div>
              </div>

              <div class="flex items-center gap-3 flex-shrink-0">
                <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg overflow-hidden">
                  <button type="button" class="btn-cart-dec px-2 py-1 text-gray-300 hover:text-white font-bold" data-index="${idx}">-</button>
                  <span class="w-7 text-center font-code font-bold text-white text-xs">${item.quantity}</span>
                  <button type="button" class="btn-cart-inc px-2 py-1 text-gray-300 hover:text-white font-bold" data-index="${idx}">+</button>
                </div>
                <span class="font-code text-cyan-300 font-bold w-16 text-left">${item.price * item.quantity} ${store.currency || 'ج.م'}</span>
                <button type="button" class="btn-cart-del p-1 text-rose-400 hover:text-rose-300" data-index="${idx}" title="حذف"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Total Price Summary -->
        <div class="p-3.5 bg-slate-900 rounded-2xl border border-cyan-500/30 flex items-center justify-between text-xs sm:text-sm">
          <span class="font-bold text-gray-200">الإجمالي النهائي للطلب:</span>
          <span class="font-code font-black text-emerald-400 text-base">${totalAmount} ${store.currency || 'ج.م'}</span>
        </div>

        <!-- Checkout Form -->
        <form id="customer-checkout-form" class="space-y-3.5 border-t border-slate-800 pt-3">
          <div>
            <label class="block text-xs font-bold text-gray-200 mb-1">ID حسابك في اللعبة / الخدمة *</label>
            <input type="text" id="checkout-customer-id" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500 text-sm" placeholder="مثال: 984521741 أو المعرف الخاص بك" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-200 mb-1">رقم هاتف التواصل (واتساب) *</label>
            <input type="tel" id="checkout-customer-phone" required maxlength="11" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500 text-sm" placeholder="مثال: 01012345678" />
            <span class="text-[10px] text-gray-400 mt-1 block">رقم مصري يبدأ بـ 010 أو 011 أو 012 أو 015 ومكون من 11 رقماً</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">ملاحظات إضافية (اختياري)</label>
            <textarea id="checkout-customer-notes" rows="2" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-xs" placeholder="أي تفاصيل إضافية تريد إبلاغ التاجر بها..."></textarea>
          </div>

          <button type="submit" id="btn-submit-order" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 hover:opacity-95 text-white font-black text-base rounded-2xl shadow-xl shadow-teal-500/20 transition flex items-center justify-center gap-2">
            <span>تأكيد وإرسال الطلب (${totalAmount} ${store.currency || 'ج.م'})</span>
            <i data-lucide="check-circle" class="w-5 h-5 text-amber-300"></i>
          </button>
        </form>
      `;

      if (window.lucide) window.lucide.createIcons();

      // Handlers
      document.getElementById('btn-close-cart-modal').onclick = () => {
        document.getElementById('customer-cart-modal').remove();
      };

      modalBox.querySelectorAll('.btn-cart-dec').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            if (cart[idx].quantity > 1) {
              cart[idx].quantity--;
            } else {
              cart.splice(idx, 1);
            }
            onCartChange();
            renderCartModalContent();
          }
        };
      });

      modalBox.querySelectorAll('.btn-cart-inc').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            if (cart[idx].quantity < cart[idx].maxStock) {
              cart[idx].quantity++;
              onCartChange();
              renderCartModalContent();
            } else {
              Swal.fire({ icon: 'info', title: 'أقصى كمية', text: `الكمية المتوفرة بالمخزون هي ${cart[idx].maxStock} قطعة فقط.` });
            }
          }
        };
      });

      modalBox.querySelectorAll('.btn-cart-del').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index, 10);
          if (cart[idx]) {
            cart.splice(idx, 1);
            onCartChange();
            renderCartModalContent();
          }
        };
      });

      // Checkout form submit
      const form = document.getElementById('customer-checkout-form');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const customerId = document.getElementById('checkout-customer-id').value.trim();
          const customerPhone = document.getElementById('checkout-customer-phone').value.trim();
          const notes = document.getElementById('checkout-customer-notes').value.trim();

          if (!customerId) {
            Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى كتابة ID حسابك' });
            return;
          }

          if (!isValidEgyptianPhone(customerPhone)) {
            Swal.fire({
              icon: 'warning',
              title: 'رقم هاتف غير صحيح',
              text: 'رقم الهاتف يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون مكوناً من 11 رقماً.'
            });
            return;
          }

          const submitBtn = document.getElementById('btn-submit-order');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>جاري إرسال الطلب...</span>`;

          try {
            const order = await createOrder({
              storeId: store.id,
              items: [...cart],
              customerId,
              customerWhatsapp: customerPhone,
              notes
            });

            // Empty cart
            cart.length = 0;
            onCartChange();

            // Close modal
            document.getElementById('customer-cart-modal').remove();

            if (window.confetti) window.confetti({ particleCount: 90, spread: 80 });

            // Compose direct message text
            let itemsText = order.items.map(it => `• ${it.title} (العدد: ${it.quantity}) - ${(it.quantity * it.price)} ${store.currency || 'ج.م'}`).join('\n');
            let fullMsg = `مرحباً إدارة متجر ${store.name} 👋\nأريد تأكيد وتنفيذ طلبي:\n📋 رقم الطلب: #${order.id}\n👤 آيدي الحساب: ${customerId}\n📱 هاتف العميل: ${customerPhone}\n📦 المنتجات المطلوبة:\n${itemsText}\n💰 الإجمالي: ${order.totalPrice} ${store.currency || 'ج.م'}`;
            if (notes) fullMsg += `\n📝 ملاحظات: ${notes}`;

            const waDirectLink = store.whatsapp ? formatEgyptianWaLink(store.whatsapp, fullMsg) : '';
            const tgDirectLink = store.telegram ? formatTelegramLink(store.telegram, fullMsg) : '';

            Swal.fire({
              icon: 'success',
              title: '🎉 تم إرسال طلبك بنجاح!',
              html: `
                <div class="text-right text-sm space-y-4 mt-2">
                  <div class="p-3 bg-slate-900 rounded-xl border border-emerald-500/30 text-xs">
                    <div class="text-gray-400">رقم الطلب الخاص بك:</div>
                    <div class="text-cyan-400 font-code font-bold text-sm mt-0.5">#${order.id}</div>
                  </div>

                  <div class="p-4 bg-slate-900/90 rounded-2xl border border-cyan-500/30 text-xs space-y-2">
                    <div class="font-bold text-white text-sm">أرسل لنا رسالة لتأكيد وتنفيذ طلبك:</div>
                    <p class="text-gray-300 leading-relaxed">
                      يرجى الضغط على الزر أدناه لإرسال تفاصيل طلبك مباشرة للتاجر للبدء الفوري في التسليم:
                    </p>
                  </div>

                  <div class="space-y-2.5 pt-1">
                    ${waDirectLink ? `
                      <a href="${waDirectLink}" target="_blank" class="block w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs sm:text-sm text-center shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        <span>إرسال تفاصيل الطلب عبر واتساب 💬</span>
                      </a>
                    ` : ''}

                    ${tgDirectLink ? `
                      <a href="${tgDirectLink}" target="_blank" class="block w-full py-3.5 px-4 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-bold text-xs sm:text-sm text-center shadow-lg shadow-sky-600/30 transition flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span>إرسال تفاصيل الطلب عبر تليجرام ✈️</span>
                      </a>
                    ` : ''}
                  </div>
                </div>
              `,
              showConfirmButton: true,
              confirmButtonText: 'إغلاق ومتابعة التسوق'
            });

            if (window.lucide) window.lucide.createIcons();

          } catch (err) {
            Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>تأكيد وإرسال الطلب</span>`;
          }
        };
      }
    }

    const modalHtml = `
      <div id="customer-cart-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div id="customer-cart-modal-box" class="glass-panel w-full max-w-lg p-6 sm:p-8 rounded-3xl border border-cyan-500/30 text-right space-y-4 max-h-[90vh] overflow-y-auto">
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    renderCartModalContent();
  }

  // =========================================================================
  // 14. Global Event Delegation & Initialization
  // =========================================================================
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      const href = link.getAttribute('href');
      if (href) {
        e.preventDefault();
        window.location.hash = href;
        navigate(href);
      }
    }
  });

  window.addEventListener('hashchange', () => navigate());
  window.addEventListener('popstate', () => navigate());

  // Execute immediately
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => navigate());
  } else {
    navigate();
  }

})();

  </script>
</body>
</html>
