  <!-- Universal Master Application Script -->
  <script>
// Store Factory Platform - Master Universal Bundle
// Supports file://, http://, and https:// environments

(function () {
  'use strict';

  // =========================================================================
  // 1. Firebase Configuration & Initialization (Dual Mode: Compat + Fallback)
  // =========================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB8AvIi-8RIEHPN4RuzOvIqBnIsr3ES4PQ",
    authDomain: "msn3-store.firebaseapp.com",
    projectId: "msn3-store",
    storageBucket: "msn3-store.firebasestorage.app",
    messagingSenderId: "173366733878",
    appId: "1:173366733878:web:1ee656ae87cac0051ffc97",
    measurementId: "G-5105MK5ZYX"
  };

  let fbApp = null;
  let fbAuth = null;
  let fbDb = null;
  let fbStorage = null;

  try {
    if (window.firebase) {
      if (!window.firebase.apps.length) {
        fbApp = window.firebase.initializeApp(firebaseConfig);
      } else {
        fbApp = window.firebase.app();
      }
      fbAuth = window.firebase.auth();
      fbDb = window.firebase.firestore();
      fbStorage = window.firebase.storage();
      console.log('✅ Firebase initialized via Compat SDK');
    }
  } catch (err) {
    console.warn('⚠️ Firebase initial connection note:', err.message);
  }

  // Helper with 2.5s network timeout to prevent hanging when offline
  async function withTimeout(promise, ms = 2500) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase timeout - using local storage')), ms))
    ]);
  }

  // =========================================================================
  // 2. LocalStorage Resilient Adapter
  // =========================================================================
  const LOCAL_PREFIX = 'msn3_store_factory_';

  function getLocalData(key, defaultVal = []) {
    try {
      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      return raw ? JSON.parse(raw) : defaultVal;
    } catch (e) {
      return defaultVal;
    }
  }

  function setLocalData(key, val) {
    try {
      localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(val));
    } catch (e) {
      console.error('LocalStorage write error:', e);
    }
  }

  // Ensure Initial Seed Codes
  function ensureInitialSeed() {
    const codes = getLocalData('codes', []);
    if (codes.length === 0) {
      const defaultCodes = [
        {
          id: 'STORE-VIP-30D',
          code: 'STORE-VIP-30D',
          durationDays: 30,
          isUsed: false,
          usedBy: null,
          usedByStoreName: null,
          note: 'كود تجريبي جاهز (30 يوماً)',
          createdAt: Date.now()
        },
        {
          id: 'STORE-PRO-90D',
          code: 'STORE-PRO-90D',
          durationDays: 90,
          isUsed: false,
          usedBy: null,
          usedByStoreName: null,
          note: 'كود باقة 3 شهور (90 يوماً)',
          createdAt: Date.now()
        },
        {
          id: 'STORE-YEAR-365D',
          code: 'STORE-YEAR-365D',
          durationDays: 365,
          isUsed: false,
          usedBy: null,
          usedByStoreName: null,
          note: 'كود سنوي كامل (365 يوماً)',
          createdAt: Date.now()
        }
      ];
      setLocalData('codes', defaultCodes);
    }
  }
  ensureInitialSeed();

  // =========================================================================
  // 3. Catbox.moe Image Uploader
  // =========================================================================
  async function uploadImageToCatbox(file, onProgress = () => {}) {
    if (!file) throw new Error('يرجى اختيار صورة صالحة');
    if (!file.type.startsWith('image/')) throw new Error('الملف المختار ليس صورة');
    if (file.size > 20 * 1024 * 1024) throw new Error('حجم الصورة كبير جداً، الحد الأقصى 20 ميجابايت');

    onProgress('جاري الرفع إلى Catbox...');

    // 1. Direct Catbox upload
    try {
      const fd = new FormData();
      fd.append('reqtype', 'fileupload');
      fd.append('fileToUpload', file);

      const res = await withTimeout(fetch('https://catbox.moe/user/api.php', {
        method: 'POST',
        body: fd
      }), 6000);

      if (res.ok) {
        const text = (await res.text()).trim();
        if (text.startsWith('http')) {
          onProgress('تم الرفع إلى Catbox بنجاح!');
          return text;
        }
      }
    } catch (e) {
      console.warn('Direct Catbox upload failed, trying proxy...', e.message);
    }

    // 2. CORS Proxy upload
    const proxies = [
      'https://corsproxy.io/?url=https://catbox.moe/user/api.php',
      'https://api.allorigins.win/raw?url=https://catbox.moe/user/api.php'
    ];

    for (const pUrl of proxies) {
      try {
        onProgress('جاري الرفع عبر سيرفر وسيط...');
        const fd = new FormData();
        fd.append('reqtype', 'fileupload');
        fd.append('fileToUpload', file);

        const pRes = await withTimeout(fetch(pUrl, { method: 'POST', body: fd }), 6000);
        if (pRes.ok) {
          const text = (await pRes.text()).trim();
          if (text.startsWith('http')) {
            onProgress('تم الرفع بنجاح!');
            return text;
          }
        }
      } catch (err) {
        console.warn('Proxy failed:', pUrl);
      }
    }

    // 3. Fallback: Local Base64 so user is NEVER blocked
    onProgress('تم حفظ الصورة بنجاح!');
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  // =========================================================================
  // 4. Database Layer (Codes, Stores, Products, Orders)
  // =========================================================================

  // Validate Code
  async function validateActivationCode(codeStr) {
    if (!codeStr || !codeStr.trim()) {
      return { valid: false, error: 'يرجى إدخال كود التفعيل' };
    }
    const clean = codeStr.trim().toUpperCase();

    // Check Firestore
    if (fbDb) {
      try {
        const snapshot = await withTimeout(
          fbDb.collection('activation_codes').where('code', '==', clean).get(),
          2500
        );
        if (!snapshot.empty) {
          const docSnap = snapshot.docs[0];
          const data = docSnap.data();
          if (data.isUsed) {
            return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${data.usedByStoreName || 'آخر'}"` };
          }
          return { valid: true, durationDays: data.durationDays || 30, codeData: data };
        }
      } catch (e) {
        console.warn('Firestore code check note:', e.message);
      }
    }

    // Check Local
    const localCodes = getLocalData('codes', []);
    const found = localCodes.find(c => c.code.toUpperCase() === clean);
    if (found) {
      if (found.isUsed) {
        return { valid: false, error: `هذا الكود تم استخدامه مسبقاً بواسطة متجر "${found.usedByStoreName || 'آخر'}"` };
      }
      return { valid: true, durationDays: found.durationDays || 30, codeData: found };
    }

    return { valid: false, error: 'كود التفعيل غير صحيح أو غير موجود بالنظام' };
  }

  // Create Code (Admin)
  async function createActivationCode({ durationDays, customCode = '', note = '' }) {
    const cleanDuration = parseInt(durationDays, 10);
    if (isNaN(cleanDuration) || cleanDuration <= 0) {
      throw new Error('يرجى تحديد عدد أيام صالح (أكبر من 0)');
    }

    const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
    const generatedCode = customCode && customCode.trim()
      ? customCode.trim().toUpperCase()
      : `STORE-${randomPart}-${cleanDuration}D`;

    const codeData = {
      id: generatedCode,
      code: generatedCode,
      durationDays: cleanDuration,
      isUsed: false,
      usedBy: null,
      usedByStoreName: null,
      note: note.trim() || `كود صلاحية ${cleanDuration} يوم`,
      createdAt: Date.now()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('activation_codes').doc(generatedCode).set(codeData), 2500);
      } catch (e) {
        console.warn('Firestore code save note:', e.message);
      }
    }

    const localCodes = getLocalData('codes', []);
    localCodes.unshift(codeData);
    setLocalData('codes', localCodes);

    return codeData;
  }

  // Get All Codes
  async function getAllActivationCodes() {
    let list = [];
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('activation_codes').get(), 2500);
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      } catch (e) {}
    }

    const localCodes = getLocalData('codes', []);
    const map = new Map();
    localCodes.forEach(c => map.set(c.code, c));
    list.forEach(c => map.set(c.code, c));

    return Array.from(map.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }

  // Delete Code
  async function deleteActivationCode(codeId) {
    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('activation_codes').doc(codeId).delete(), 2000);
      } catch (e) {}
    }
    const localCodes = getLocalData('codes', []).filter(c => c.id !== codeId && c.code !== codeId);
    setLocalData('codes', localCodes);
  }

  // Mark Code as Used
  async function markCodeAsUsed(codeStr, storeId, storeName) {
    const clean = codeStr.trim().toUpperCase();
    const updates = {
      isUsed: true,
      usedBy: storeId,
      usedByStoreName: storeName,
      usedAt: Date.now()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('activation_codes').doc(clean).update(updates), 2000);
      } catch (e) {}
    }

    const localCodes = getLocalData('codes', []);
    const target = localCodes.find(c => c.code === clean);
    if (target) {
      Object.assign(target, updates);
      setLocalData('codes', localCodes);
    }
  }

  // Create Store
  async function createStore({ ownerUid, ownerEmail, storeName, slug, logoUrl, whatsapp, currency = 'ج.م', bio = '', activationCode, durationDays }) {
    const cleanSlug = slug.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
    const now = Date.now();
    const durationMs = durationDays * 24 * 60 * 60 * 1000;
    const expiresAt = now + durationMs;
    const storeId = cleanSlug || `store_${Date.now()}`;

    const storeData = {
      id: storeId,
      ownerUid,
      ownerEmail,
      name: storeName.trim(),
      slug: cleanSlug,
      logoUrl: logoUrl || 'https://files.catbox.moe/placeholder.png',
      whatsapp: whatsapp ? whatsapp.trim().replace(/[^0-9+]/g, '') : '',
      currency: currency.trim() || 'ج.م',
      bio: bio.trim(),
      activationCode: activationCode.toUpperCase(),

  // Check if store is active

  // Subscription Time Remaining
  function getSubscriptionTimeRemaining(expiresAt) {
    const diff = (expiresAt || 0) - Date.now();
    if (diff <= 0) {
      return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0, formatted: 'منتهي الصلاحية' };
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    let formatted = '';
    if (days > 0) formatted += `${days} يوم و `;
    formatted += `${hours} ساعة و ${minutes} دقيقة`;

    return { expired: false, days, hours, minutes, seconds, formatted };
  }

  // Renew Store Subscription
  async function renewStoreSubscription(storeId, newCodeStr) {
    const validation = await validateActivationCode(newCodeStr);
    if (!validation.valid) throw new Error(validation.error);

    const store = await getStoreById(storeId);
    if (!store) throw new Error('المتجر غير موجود');

    const now = Date.now();
    const additionalMs = validation.durationDays * 24 * 60 * 60 * 1000;
    const baseTime = (store.expiresAt && store.expiresAt > now) ? store.expiresAt : now;
    const newExpiresAt = baseTime + additionalMs;

    const updates = {
      expiresAt: newExpiresAt,
      durationDays: (store.durationDays || 0) + validation.durationDays,
      status: 'active',
      lastRenewedAt: now,
      lastRenewCode: newCodeStr.trim().toUpperCase()
    };

    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('stores').doc(storeId).update(updates), 2500);
      } catch (e) {}
    }

    const localStores = getLocalData('stores', []);
    const target = localStores.find(s => s.id === storeId);
    if (target) {
      Object.assign(target, updates);
      setLocalData('stores', localStores);
    }

    await markCodeAsUsed(newCodeStr, storeId, store.name);
    return { success: true, newExpiresAt, addedDays: validation.durationDays };
  }

  // Complete Deal: Only decrease quantity when marked completed!
  async function completeDeal(orderId, storeId) {
    let order = null;
    if (fbDb) {
      try {
        const snap = await withTimeout(fbDb.collection('orders').doc(orderId).get(), 2000);
        if (snap.exists) order = snap.data();
      } catch (e) {}
    }
    if (!order) {
      const localOrders = getLocalData('orders', []);
      order = localOrders.find(o => o.id === orderId);
    }
    if (!order) throw new Error('الطلب غير موجود');
    if (order.status === 'completed') throw new Error('الصفقة مكتملة بالفعل مسبقاً');

    const quantityToDeduct = order.orderQuantity || 1;
    const productId = order.productId;

    // Fetch product
    let product = null;
    if (fbDb) {
      try {
        const pSnap = await withTimeout(fbDb.collection('products').doc(productId).get(), 2000);
        if (pSnap.exists) product = pSnap.data();
      } catch (e) {}
    }
    if (!product) {
      const localProducts = getLocalData('products', []);
      product = localProducts.find(p => p.id === productId);
    }

    let newQuantity = 0;
    if (product) {
      newQuantity = Math.max(0, (parseInt(product.quantity, 10) || 0) - quantityToDeduct);
      if (fbDb) {
        try {
          await withTimeout(fbDb.collection('products').doc(productId).update({ quantity: newQuantity }), 2000);
        } catch (e) {}
      }
      const localProducts = getLocalData('products', []);
      const pTarget = localProducts.find(p => p.id === productId);
      if (pTarget) {
        pTarget.quantity = newQuantity;
        setLocalData('products', localProducts);
      }
    }

    const orderUpdates = { status: 'completed', completedAt: Date.now() };
    if (fbDb) {
      try {
        await withTimeout(fbDb.collection('orders').doc(orderId).update(orderUpdates), 2000);
      } catch (e) {}
    }
    const localOrders = getLocalData('orders', []);
    const oTarget = localOrders.find(o => o.id === orderId);
    if (oTarget) {
      Object.assign(oTarget, orderUpdates);
      setLocalData('orders', localOrders);
    }

    return { success: true, orderId, productId, newQuantity, deducted: quantityToDeduct };
  }

  async function registerMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.createUserWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          try {
            const lCred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
            uid = lCred.user.uid;
          } catch (err) {
            throw new Error('هذا البريد مسجل مسبقاً، يرجى تسجيل الدخول أو اختيار بريد آخر.');
          }
        }
      }
    }
    if (!uid) {
      uid = `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
    }

    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  async function loginMerchant(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    let uid = null;
    if (fbAuth) {
      try {
        const cred = await withTimeout(fbAuth.signInWithEmailAndPassword(cleanEmail, password), 3000);
        uid = cred.user.uid;
      } catch (e) {}
    }
    if (!uid) {
      const store = await getStoreByOwner(null, cleanEmail);
      if (store) {
        uid = store.ownerUid || `merchant_${cleanEmail.replace(/[^a-z0-9]/g, '_')}`;
      } else {
        throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة، أو المتجر غير مسجل.');
      }
    }
    const sessionData = { uid, email: cleanEmail, role: 'merchant', loginTime: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
    return sessionData;
  }

  // 6. Router & View Orchestrator
  // =========================================================================
  let activeStore = null;
  let countdownInterval = null;

  function parseCurrentRoute() {
    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    if (storeParam) {
      return { view: 'store', slug: storeParam.trim().toLowerCase() };
    }

    const hash = window.location.hash.replace(/^#\/?/, '').trim();

    if (hash.startsWith('store/')) {
      const slug = hash.replace('store/', '').trim().toLowerCase();
      return { view: 'store', slug };
    }
    if (hash === 'admin') return { view: 'admin' };
    if (hash === 'merchant' || hash === 'login') return { view: 'merchant' };
    if (hash === 'register' || hash === 'create') return { view: 'register' };

    // Subdomain check
    const host = window.location.hostname.toLowerCase();
    if (host.endsWith('stores.privateee.online') && host !== 'stores.privateee.online') {
      const sub = host.split('.')[0];
      if (sub && sub !== 'www') return { view: 'store', slug: sub };
    }

    if (hash && !['home', 'contact', 'about'].includes(hash)) {
      return { view: 'store', slug: hash.toLowerCase() };
    }

    return { view: 'landing' };
  }

  function updateNavHighlight(activeKey) {
    const links = document.querySelectorAll('.nav-link-btn');
    links.forEach(l => {
      if (l.dataset.nav === activeKey) {
        l.classList.add('text-cyan-400', 'bg-cyan-500/10');
        l.classList.remove('text-gray-300');
      } else {
        l.classList.remove('text-cyan-400', 'bg-cyan-500/10');
        l.classList.add('text-gray-300');
      }
    });
  }

  async function navigate(targetHash = null) {
    if (targetHash !== null) {
      if (window.location.hash !== targetHash) {
        window.location.hash = targetHash;
        return; // hashchange will trigger navigate
      }
    }

    const route = parseCurrentRoute();
    const mainContainer = document.getElementById('main-content');
    const navbar = document.getElementById('main-navbar');

    if (!mainContainer) return;
    mainContainer.innerHTML = '';

    switch (route.view) {
      case 'store':
        if (navbar) navbar.classList.add('hidden');
        mainContainer.innerHTML = `<div id="storefront-container"></div>`;
        initStorefront(route.slug, document.getElementById('storefront-container'));
        break;

      case 'admin':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('admin');
        mainContainer.innerHTML = `<div id="admin-container"></div>`;
        renderAdminView();
        break;

      case 'merchant':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('merchant');
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('dashboard');
        break;

      case 'register':
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('register');
        mainContainer.innerHTML = `<div id="merchant-container"></div>`;
        initMerchantModule('register');
        break;

      case 'landing':
      default:
        if (navbar) navbar.classList.remove('hidden');
        updateNavHighlight('home');
        renderLandingPage(mainContainer);
        break;
    }

    window.scrollTo(0, 0);
    if (window.lucide) window.lucide.createIcons();
  }

  function initMerchantModule(action = 'dashboard') {
    const container = document.getElementById('merchant-container');
    if (!container) return;

    if (action === 'register') {
      renderMerchantRegistration(container);
      return;
    }

    const currentMerchant = getCurrentMerchant();
    if (!currentMerchant) {
      renderMerchantLogin(container);
      return;
    }

    getStoreByOwner(currentMerchant.uid, currentMerchant.email).then(store => {
      activeStore = store;
      if (!activeStore) {
        renderMerchantRegistration(container, currentMerchant);
        return;
      }

      const timeRemaining = getSubscriptionTimeRemaining(activeStore.expiresAt);
      if (timeRemaining.expired || activeStore.status === 'expired') {
        renderExpiredSubscriptionScreen(container, activeStore);
        return;
      }

      renderMerchantDashboard(container, activeStore);
    });
  }

          slug,

          activationCode: validatedCode,

  // Products Tab
  async function renderProductsTab(contentDiv, store) {
    contentDiv.innerHTML = `
      <div class="space-y-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-white">إدارة المنتجات والمخزون</h2>
            <p class="text-xs text-gray-400">الكمية لا تنقص إلا عند تأكيدك لإتمام الصفقة مع العميل</p>
          </div>
          <button id="btn-open-add-product" class="px-5 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-bold rounded-2xl shadow-lg transition flex items-center gap-2 text-sm">
            <i data-lucide="plus" class="w-5 h-5"></i>
            <span>إضافة منتج جديد</span>
          </button>
        </div>
        <div id="merchant-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="col-span-full py-12 text-center text-gray-500">جاري تحميل المنتجات...</div>
        </div>
      </div>
    `;
    if (window.lucide) window.lucide.createIcons();

    const products = await getStoreProducts(store.id);
    const grid = document.getElementById('merchant-products-grid');

    function renderGrid() {
      if (!products.length) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 glass-panel rounded-3xl">
            <i data-lucide="package-open" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
            <p class="text-base font-bold text-gray-400">لا توجد منتجات في متجرك حالياً</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = products.map(prod => {
        const isOutOfStock = prod.quantity <= 0;
        return `
          <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between border border-slate-800">
            <div>
              <div class="relative aspect-video bg-slate-950 overflow-hidden">
                <img src="${prod.imageUrl || 'https://files.catbox.moe/placeholder.png'}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=Product'" />
                <span class="absolute top-3 right-3 px-2.5 py-1 rounded-xl text-xs font-bold ${isOutOfStock ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'}">
                  ${isOutOfStock ? 'نفذت الكمية ❌' : `متوفر: ${prod.quantity}`}
                </span>
                <span class="absolute bottom-3 left-3 px-3 py-1 rounded-xl text-xs font-bold bg-slate-900/90 text-cyan-300 font-code">
                  ${prod.price} ${store.currency || 'ج.م'}
                </span>
              </div>
              <div class="p-4 text-right space-y-1">
                <h3 class="font-bold text-white text-base truncate">${prod.title}</h3>
                <p class="text-xs text-gray-400 line-clamp-2">${prod.description || ''}</p>
              </div>
            </div>
            <div class="p-4 pt-0 border-t border-slate-800/60 mt-3 flex items-center justify-between">
              <span class="text-[11px] text-gray-500 font-code">#${prod.id.slice(-6)}</span>
              <div class="flex items-center gap-2">
                <button data-id="${prod.id}" class="btn-delete-product p-2 hover:bg-rose-500/20 rounded-xl text-rose-400 transition" title="حذف">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      grid.querySelectorAll('.btn-delete-product').forEach(btn => {
        btn.onclick = async () => {
          const prodId = btn.dataset.id;
          const confirm = await Swal.fire({ title: 'حذف المنتج؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم' });
          if (confirm.isConfirmed) {
            await deleteProduct(prodId);
            const idx = products.findIndex(p => p.id === prodId);
            if (idx >= 0) products.splice(idx, 1);
            renderGrid();
          }
        };
      });
    }

    renderGrid();

    document.getElementById('btn-open-add-product').onclick = () => {
      openProductModal(store, null, () => renderProductsTab(contentDiv, store));
    };
  }

  // Add Product Modal
  function openProductModal(store, existingProd = null, onSuccess = () => {}) {
    let uploadedUrl = existingProd ? existingProd.imageUrl : '';

    const modalHtml = `
      <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div class="glass-panel w-full max-w-lg p-6 sm:p-8 rounded-3xl border border-cyan-500/30 text-right space-y-4 max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i data-lucide="package-plus" class="w-5 h-5 text-cyan-400"></i>
              <span>إضافة منتج جديد للمتجر</span>
            </h3>
            <button id="btn-close-prod-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <form id="prod-modal-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">اسم المنتج *</label>
              <input type="text" id="modal-prod-title" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:border-cyan-500" placeholder="مثال: شحن 1000 جوهرة فري فاير" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">السعر (${store.currency || 'ج.م'}) *</label>
                <input type="number" step="0.01" min="0" id="modal-prod-price" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left focus:border-cyan-500" placeholder="50" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">الكمية بالمخزون *</label>
                <input type="number" min="0" id="modal-prod-qty" value="10" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left focus:border-cyan-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">صورة المنتج (Catbox) *</label>
              <div class="flex items-center gap-4">
                <div id="prod-image-preview" class="w-16 h-16 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-center overflow-hidden flex-shrink-0">
                  <i data-lucide="image" class="w-6 h-6 text-gray-600"></i>
                </div>
                <div class="flex-1">
                  <input type="file" id="modal-prod-file" accept="image/*" class="hidden" />
                  <button type="button" id="btn-upload-prod-img" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-slate-700">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                    <span>رفع الصورة على Catbox</span>
                  </button>
                  <div id="prod-upload-status" class="text-[11px] text-gray-400 mt-1">تظهر مباشرة لعملائك بالمتجر</div>
                </div>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">تفاصيل ووصف المنتج</label>
              <textarea id="modal-prod-desc" rows="3" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:border-cyan-500 text-sm" placeholder="اكتب هنا شروط أو تفاصيل التسليم..."></textarea>
            </div>

            <button type="submit" id="btn-save-prod" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-extrabold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
              <span>إضافة المنتج للمتجر</span>
              <i data-lucide="check" class="w-5 h-5"></i>
            </button>
          </form>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    if (window.lucide) window.lucide.createIcons();

    const modalEl = document.getElementById('product-modal');
    const closeBtn = document.getElementById('btn-close-prod-modal');
    const fileInput = document.getElementById('modal-prod-file');
    const btnUpload = document.getElementById('btn-upload-prod-img');
    const previewBox = document.getElementById('prod-image-preview');
    const uploadStatus = document.getElementById('prod-upload-status');
    const form = document.getElementById('prod-modal-form');

    closeBtn.onclick = () => modalEl.remove();

    btnUpload.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      btnUpload.disabled = true;
      try {
        const url = await uploadImageToCatbox(file, (msg) => { uploadStatus.textContent = msg; });
        uploadedUrl = url;
        previewBox.innerHTML = `<img src="${url}" class="w-full h-full object-cover" />`;
        uploadStatus.innerHTML = `<span class="text-emerald-400 font-bold">تم الرفع بنجاح!</span>`;
      } catch (err) {
        uploadStatus.innerHTML = `<span class="text-rose-400 font-bold">خطأ: ${err.message}</span>`;
      } finally {
        btnUpload.disabled = false;
      }
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('modal-prod-title').value;
      const price = document.getElementById('modal-prod-price').value;
      const quantity = document.getElementById('modal-prod-qty').value;
      const description = document.getElementById('modal-prod-desc').value;

      const saveBtn = document.getElementById('btn-save-prod');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>جاري الحفظ...</span>`;

      try {
        await addProduct(store.id, {
          title,
          price,
          quantity,
          description,
          imageUrl: uploadedUrl || 'https://files.catbox.moe/placeholder.png'
        });
        modalEl.remove();
        onSuccess();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'تمت إضافة المنتج بنجاح!', timer: 1500, showConfirmButton: false });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<span>إضافة المنتج</span>`;
      }
    };
  }

    const orders = await getStoreOrders(store.id);
    const listContainer = document.getElementById('merchant-orders-list');

    function renderOrders() {
      if (!orders.length) {
        listContainer.innerHTML = `
          <div class="py-16 text-center text-gray-500 glass-panel rounded-3xl">
            <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>

          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      listContainer.innerHTML = orders.map(order => {
        const isPending = order.status === 'pending';
        const cleanWa = (order.customerWhatsapp || '').replace(/[^0-9]/g, '');
        const waLink = `https://wa.me/${cleanWa}?text=${encodeURIComponent(`مرحباً بك بخصوص طلبك (${order.id}) في متجر ${store.name}`)}`;

        return `
          <div class="glass-panel p-5 sm:p-6 rounded-2xl border ${isPending ? 'border-amber-500/30 bg-amber-500/5' : 'border-slate-800'} transition flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div class="space-y-3 text-right flex-1">
              <div class="flex items-center gap-3">
                <span class="font-code font-bold text-cyan-400 text-sm">#${order.id}</span>
                ${isPending 
                  ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">قيد الانتظار</span>`
                  : `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">تمت الصفقة وخصم المخزون</span>`
                }
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3 bg-slate-900/90 rounded-xl border border-slate-800 text-xs">
                <div class="flex items-center justify-between">
                  <span class="text-gray-400">ID حساب العميل:</span>
                  <span class="font-code font-bold text-white text-sm bg-slate-950 px-2 py-1 rounded border border-slate-700">${order.customerId}</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-gray-400">رقم واتساب العميل:</span>
                  <a href="${waLink}" target="_blank" class="font-code font-bold text-emerald-400 flex items-center gap-1">
                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                    <span>${order.customerWhatsapp}</span>
                  </a>
                </div>
              </div>

              <div class="text-xs text-gray-300">
                <span class="font-bold text-white">${order.productTitle}</span>
                <span>• عدد: <strong class="text-cyan-400 font-code">${order.orderQuantity}</strong></span>
                <span>• إجمالي: <strong class="text-emerald-400 font-code">${order.totalPrice} ${store.currency || 'ج.م'}</strong></span>
              </div>
            </div>

            <div>
              ${isPending ? `
                <button data-order-id="${order.id}" class="btn-complete-deal px-5 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-lg transition flex items-center gap-2">
                  <i data-lucide="check-check" class="w-5 h-5 text-amber-300"></i>
                  <span>إتمام الصفقة (خصم الكمية)</span>
                </button>
              ` : `
                <span class="text-xs text-emerald-400 font-bold">صفقة مكتملة</span>
              `}
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();

      listContainer.querySelectorAll('.btn-complete-deal').forEach(btn => {
        btn.onclick = async () => {
          const orderId = btn.dataset.orderId;
          const confirm = await Swal.fire({
            title: 'إتمام الصفقة؟',
            text: 'سيتم تحويل حالة الطلب لمكتمل وخصم الكمية تلقائياً من المخزون.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'نعم، إتمام وخصم'
          });

          if (confirm.isConfirmed) {
            btn.disabled = true;
            btn.innerHTML = `<span>جاري الإتمام...</span>`;
            try {
              const res = await completeDeal(orderId, store.id);
              if (window.confetti) window.confetti({ particleCount: 70, spread: 70 });
              const ord = orders.find(o => o.id === orderId);
              if (ord) ord.status = 'completed';
              Swal.fire({ icon: 'success', title: 'تمت الصفقة بنجاح!', text: `تم خصم ${res.deducted} قطعة، المتبقي: ${res.newQuantity}` });
              renderOrders();
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
            }
          }
        };
      });
    }

    renderOrders();
  }

  function promptRenewalModal(store, onRenewed = () => {}) {
    Swal.fire({
      title: 'تمديد اشتراك المتجر',
      html: `
        <div class="text-right text-sm space-y-3">
          <p>أدخل كود اشتراك إضافي لإضافة الأيام إلى متجرك:</p>
          <input type="text" id="swal-renew-input" placeholder="STORE-VIP-30D" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code uppercase text-left font-bold" />
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'تأكيد التمديد',
      preConfirm: async () => {
        const code = document.getElementById('swal-renew-input').value.trim();
        if (!code) {
          Swal.showValidationMessage('يرجى كتابة كود الاشتراك');
          return false;
        }
        try {
          return await renewStoreSubscription(store.id, code);
        } catch (e) {
          Swal.showValidationMessage(e.message || 'الكود غير صالح');
          return false;
        }
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        if (window.confetti) window.confetti({ particleCount: 70, spread: 80 });
        const updated = await getStoreById(store.id);
        Object.assign(store, updated);
        onRenewed();
        Swal.fire({ icon: 'success', title: 'تم التمديد بنجاح!', text: `تمت إضافة ${result.value.addedDays} يوماً لمتجرك.` });
      }
    });
  }

    if (!store) {
      container.innerHTML = `
        <div class="max-w-lg mx-auto my-20 p-8 glass-panel rounded-3xl text-center space-y-4 border border-rose-500/20">
          <h2 class="text-2xl font-black text-white">المتجر غير موجود!</h2>
          <p class="text-gray-400 text-sm">لم نتمكن من العثور على متجر بالاسم (${slug})</p>
          <a href="#" class="px-6 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold inline-block">الرئيسية</a>
        </div>
      `;
      return;
    }

    if (!isStoreActive(store)) {
      container.innerHTML = `
        <div class="max-w-lg mx-auto my-16 p-8 glass-panel rounded-3xl text-center space-y-4 border border-amber-500/30">
          <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300">المتجر متوقف حالياً</span>
          <h2 class="text-2xl font-black text-white">${store.name}</h2>
          <p class="text-gray-300 text-sm">عذراً، هذا المتجر متوقف مؤقتاً لانتهاء فترة الاشتراك أو الصيانة من قبل التاجر.</p>
        </div>
      `;
      return;
    }

    const products = await getStoreProducts(store.id);

    container.innerHTML = `
      <div class="max-w-6xl mx-auto py-6 px-4 space-y-8">
        <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-cyan-500/20 flex flex-col sm:flex-row items-center justify-between gap-6 text-center sm:text-right">
          <div class="flex flex-col sm:flex-row items-center gap-5">
            <img src="${store.logoUrl || 'https://files.catbox.moe/placeholder.png'}" class="w-20 h-20 rounded-2xl object-cover border-2 border-cyan-500/40 bg-slate-900" />
            <div>
              <h1 class="text-2xl sm:text-3xl font-black text-white">${store.name}</h1>
              <p class="text-sm text-gray-300 mt-1 max-w-xl">${store.bio || 'أهلاً بكم في متجرنا! شحن فوري ومضمون.'}</p>
            </div>
          </div>
          ${store.whatsapp ? `
            <a href="https://wa.me/${store.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="px-5 py-3 bg-emerald-600 text-white font-bold rounded-2xl text-xs sm:text-sm">
              تواصل مع المتجر واتساب
            </a>
          ` : ''}
        </div>

        <div id="storefront-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          ${!products.length ? `
            <div class="col-span-full py-16 text-center text-gray-500 glass-panel rounded-3xl">لا توجد منتجات معروضة حالياً</div>
          ` : products.map(prod => {
            const isOutOfStock = prod.quantity <= 0;
            return `
              <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-slate-800 shadow-xl">
                <div>
                  <div class="relative aspect-video bg-slate-950 overflow-hidden">
                    <img src="${prod.imageUrl || 'https://files.catbox.moe/placeholder.png'}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=Product'" />
                    <span class="absolute top-3 right-3 px-3 py-1 rounded-xl text-xs font-bold ${isOutOfStock ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-950'}">
                      ${isOutOfStock ? 'نفذت الكمية ❌' : `متوفر: ${prod.quantity}`}
                    </span>
                    <span class="absolute bottom-3 left-3 px-3 py-1.5 rounded-xl text-sm font-black bg-slate-950/90 text-cyan-300 font-code">
                      ${prod.price} ${store.currency || 'ج.م'}
                    </span>
                  </div>
                  <div class="p-5 text-right space-y-2">
                    <h3 class="font-extrabold text-white text-lg">${prod.title}</h3>
                    <p class="text-xs text-gray-300 line-clamp-3">${prod.description || ''}</p>
                  </div>
                </div>

                <div class="p-5 pt-0">
                  ${isOutOfStock ? `
                    <button disabled class="w-full py-3.5 bg-slate-800 text-gray-500 font-bold rounded-xl text-sm cursor-not-allowed">نفذت الكمية</button>
                  ` : `
                    <button data-prod-id="${prod.id}" class="btn-buy-product w-full py-3.5 bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-600 hover:opacity-95 text-white font-extrabold rounded-xl text-sm shadow-lg">
                      شراء الآن
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    if (window.lucide) window.lucide.createIcons();

    container.querySelectorAll('.btn-buy-product').forEach(btn => {
      btn.onclick = () => {
        const prod = products.find(p => p.id === btn.dataset.prodId);
        if (prod) openBuyModal(store, prod);
      };
    });
  }

  function openBuyModal(store, product) {
    const modalHtml = `
      <div id="customer-buy-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
        <div class="glass-panel w-full max-w-lg p-6 sm:p-8 rounded-3xl border border-cyan-500/30 text-right space-y-5 max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white">إتمام طلب الشراء (${store.name})</h3>
            <button id="btn-close-buy-modal" class="p-1 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="p-3 bg-slate-900 rounded-xl flex items-center justify-between text-xs">
            <span class="font-bold text-white">${product.title}</span>
            <span class="font-code text-cyan-400 font-bold">${product.price} ${store.currency || 'ج.م'}</span>
          </div>

          <form id="customer-checkout-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-200 mb-1">ادخل ID حسابك * (آيدي اللعبة / المعرف / اسم الحساب)</label>
              <input type="text" id="checkout-customer-id" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500" placeholder="مثال: 984521741" />
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-200 mb-1">رقم تواصل واتساب *</label>
              <input type="tel" id="checkout-customer-wa" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-code text-left font-bold focus:border-cyan-500" placeholder="مثال: 01012345678" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">ملاحظات إضافية (اختياري)</label>
              <textarea id="checkout-customer-notes" rows="2" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-xs"></textarea>
            </div>

            <button type="submit" id="btn-submit-order" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 hover:opacity-95 text-white font-black text-base rounded-2xl shadow-xl">
              تأكيد الطلب (تم)
            </button>
          </form>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    if (window.lucide) window.lucide.createIcons();

    const modalEl = document.getElementById('customer-buy-modal');
    document.getElementById('btn-close-buy-modal').onclick = () => modalEl.remove();

    document.getElementById('customer-checkout-form').onsubmit = async (e) => {
      e.preventDefault();
      const customerId = document.getElementById('checkout-customer-id').value.trim();
      const customerWhatsapp = document.getElementById('checkout-customer-wa').value.trim();
      const notes = document.getElementById('checkout-customer-notes').value.trim();

      const submitBtn = document.getElementById('btn-submit-order');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>جاري الإرسال...</span>`;

      try {
        const order = await createOrder({
          storeId: store.id,
          productId: product.id,
          productTitle: product.title,
          productPrice: product.price,
          orderQuantity: 1,
          customerId,
          customerWhatsapp,
          notes
        });

        modalEl.remove();
        if (window.confetti) window.confetti({ particleCount: 80 });

        const cleanWa = (store.whatsapp || '').replace(/[^0-9]/g, '');
        const waDirectChat = cleanWa 
          ? `https://wa.me/${cleanWa}?text=${encodeURIComponent(`مرحباً إدارة متجر ${store.name}، طلبت منتج (${product.title}) رقم الطلب: #${order.id}، الـ ID: ${customerId}`)}`
          : null;

        Swal.fire({
          icon: 'success',
          title: '🎉 تم إرسال طلبك بنجاح!',
          html: `
            <div class="text-right text-sm space-y-2 mt-2">
              <p>وصل طلبك مباشرة إلى لوحة تحكم التاجر.</p>
              <div class="p-2 bg-slate-900 rounded font-code text-xs text-cyan-400">رقم الطلب: #${order.id}</div>
              ${waDirectChat ? `<a href="${waDirectChat}" target="_blank" class="block w-full py-2.5 mt-2 bg-emerald-600 text-white rounded font-bold text-xs text-center">تأكيد الطلب مع التاجر على واتساب</a>` : ''}
            </div>
          `
        });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'خطأ', text: err.message });
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>تأكيد الطلب (تم)</span>`;
      }
    };
  }

  // =========================================================================
  // 13. Global Event Delegation & Initialization
  // =========================================================================
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      const href = link.getAttribute('href');
      if (href) {
        e.preventDefault();
        window.location.hash = href;
        navigate(href);
      }
    }
  });

  window.addEventListener('hashchange', () => navigate());
  window.addEventListener('popstate', () => navigate());

  // Execute immediately
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => navigate());
  } else {
    navigate();
  }

})();


</script>

</body>
</html>
